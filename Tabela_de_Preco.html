<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Tabela de Preço - Dashboard Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== LOGIN SCREEN ===== */
.login-overlay { position:fixed; inset:0; z-index:99999; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); display:flex; align-items:center; justify-content:center; }
.login-box { background:white; border-radius:16px; padding:40px; width:100%; max-width:380px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
.login-box h2 { text-align:center; color:var(--gray-800); margin-bottom:6px; font-size:22px; }
.login-box .subtitle { text-align:center; color:var(--gray-500); font-size:13px; margin-bottom:24px; }
.login-box .form-group { margin-bottom:14px; }
.login-box .form-group label { display:block; font-size:12px; font-weight:600; color:var(--gray-600); margin-bottom:4px; }
.login-box .form-group input { width:100%; padding:10px 14px; border:1px solid var(--gray-300); border-radius:8px; font-size:14px; font-family:inherit; outline:none; transition:border 0.2s; }
.login-box .form-group input:focus { border-color:var(--primary); }
.login-box .btn-login { width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:background 0.2s; }
.login-box .btn-login:hover { background:var(--primary-light); }
.login-box .login-error { color:var(--danger); font-size:12px; text-align:center; margin-top:10px; min-height:18px; }
/* ===== USER MANAGER ===== */
.user-card { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--gray-200); border-radius:8px; margin-bottom:8px; }
.user-card .user-avatar { width:36px; height:36px; border-radius:50%; background:var(--primary); color:white; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0; }
.user-card .user-info { flex:1; }
.user-card .user-info .name { font-size:13px; font-weight:600; color:var(--gray-800); }
.user-card .user-info .email { font-size:11px; color:var(--gray-500); }
.user-card .user-actions { display:flex; gap:4px; }
.perm-tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:600; margin:2px; }
.perm-tag.active { background:var(--primary-bg); color:var(--primary); border:1px solid var(--primary-light); }
.perm-tag.inactive { background:var(--gray-100); color:var(--gray-400); border:1px solid var(--gray-200); }

/* Sidebar user views */
.sidebar.collapsed .sidebar-user-expanded { display:none !important; }
.sidebar.collapsed .sidebar-user-collapsed { display:block !important; }
.sidebar:not(.collapsed) .sidebar-user-expanded { display:block !important; }
.sidebar:not(.collapsed) .sidebar-user-collapsed { display:none !important; }
.sidebar.collapsed #sidebarUserInfo { padding:8px 4px; }
.sidebar.collapsed .sidebar-footer { padding:14px 0; text-align:center; }
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #4f46e5;
  --primary-light: #818cf8;
  --primary-dark: #3730a3;
  --primary-bg: #eef2ff;
  --success: #10b981;
  --success-bg: #d1fae5;
  --warning: #f59e0b;
  --warning-bg: #fef3c7;
  --danger: #ef4444;
  --danger-bg: #fee2e2;
  --gray-50: #f8fafc;
  --gray-100: #f1f5f9;
  --gray-200: #e2e8f0;
  --gray-300: #cbd5e1;
  --gray-400: #94a3b8;
  --gray-500: #64748b;
  --gray-600: #475569;
  --gray-700: #334155;
  --gray-800: #1e293b;
  --gray-900: #0f172a;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.06), 0 1px 2px -1px rgb(0 0 0 / 0.06);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.05);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.04);
  --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.04);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --side-w: 240px;
  --side-w-collapsed: 64px;
  --gold: #c8961a;
}
body { font-family: 'Inter', sans-serif; background: var(--gray-50); color: var(--gray-900); min-height: 100vh; }

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: var(--side-w);
  background: linear-gradient(180deg, #0B1E3D 0%, #122C52 45%, #0A1830 100%);
  color: white; z-index: 300;
  display: flex; flex-direction: column;
  transition: width .25s ease, transform .25s ease;
  overflow: visible;
}
.sidebar.collapsed { width: var(--side-w-collapsed); }
.sidebar-logo {
  padding: 18px 18px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; gap: 11px; flex-shrink: 0;
}
.sidebar.collapsed .sidebar-logo { padding: 18px 0 16px; justify-content: center; }
.sidebar-logo .icon {
  width: 22px; height: 22px; color: var(--gold); flex-shrink: 0;
}
.sidebar-logo .brand-text { white-space: nowrap; overflow: hidden; }
.sidebar-logo .brand-text h1 { font-size: 14px; font-weight: 700; color: #fff; line-height: 1.2; }
.sidebar-logo .brand-text p { font-size: 10.5px; color: rgba(255,255,255,0.45); letter-spacing: 0.03em; }
.sidebar.collapsed .sidebar-logo .brand-text { display: none; }

.sidebar-nav { flex: 1; padding: 4px 10px 16px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 2px; }
.sidebar-nav .label { font-size: 10px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.8px; padding: 14px 11px 6px; font-weight: 600; }
.sidebar.collapsed .sidebar-nav .label { display: none; }

.side-item { display: flex; flex-direction: column; }
.nav-item {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  background: none; border: none; cursor: pointer;
  color: rgba(255,255,255,0.7);
  font-weight: 600; font-size: 13px; letter-spacing: 0.01em;
  padding: 10px 11px; border-radius: 10px;
  transition: background .15s ease, color .15s ease;
  text-decoration: none;
}
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.85; }
.nav-item .chev { margin-left: auto; width: 13px; height: 13px; opacity: 0.5; transition: transform .18s ease; }
.side-item.open > .nav-item .chev { transform: rotate(180deg); }
.nav-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
.nav-item.active { color: #fff; background: rgba(255,255,255,0.12); }
.side-item.active > .nav-item { color: #fff; background: rgba(255,255,255,0.09); }

.side-sub { display: flex; flex-direction: column; padding: 0 0 0 24px; gap: 1px; max-height: 0; overflow: hidden; opacity: 0; transition: max-height .28s ease, opacity .2s ease, padding .28s ease; }
.side-item.open > .side-sub { max-height: 260px; opacity: 1; padding: 3px 0 6px 24px; }
.side-sub a {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px; border-radius: 8px;
  font-size: 12.5px; font-weight: 500;
  color: rgba(255,255,255,0.52); text-decoration: none; cursor: pointer;
  transition: background .12s ease, color .12s ease;
}
.side-sub a svg { width: 14px; height: 14px; flex-shrink: 0; opacity: 0.8; }
.side-sub a:hover { background: rgba(255,255,255,0.06); color: #fff; }
.side-sub a.active { color: var(--gold); font-weight: 600; background: rgba(200,150,26,0.13); }

.nav-item .badge {
  margin-left: auto; background: var(--primary-light); color: white; font-size: 10px;
  padding: 1px 7px; border-radius: 20px; font-weight: 600; min-width: 18px; text-align: center;
}

/* Collapsed state */
.sidebar.collapsed .nav-item span:not(.badge),
.sidebar.collapsed .nav-item .chev,
.sidebar.collapsed .side-sub { display: none; }
.sidebar.collapsed .nav-item { justify-content: center; padding: 11px 0; }
.sidebar.collapsed .nav-item .badge { display: none; }

/* Collapsed peek on hover */
.sidebar.collapsed.peek { width: var(--side-w); box-shadow: var(--shadow-xl); }
.sidebar.collapsed.peek .sidebar-logo { padding: 18px 18px 16px; justify-content: flex-start; }
.sidebar.collapsed.peek .sidebar-logo .brand-text { display: block; }
.sidebar.collapsed.peek .nav-item { justify-content: flex-start; padding: 10px 11px; }
.sidebar.collapsed.peek .nav-item span:not(.badge),
.sidebar.collapsed.peek .nav-item .chev { display: inline-flex; }
.sidebar.collapsed.peek .side-item.open > .side-sub { display: flex; }
.sidebar.collapsed.peek .sidebar-nav .label { display: block; }

/* Tooltip for collapsed */
.sidebar.collapsed:not(.peek) .nav-item { position: relative; }
.sidebar.collapsed:not(.peek) .nav-item::after {
  content: attr(data-label);
  position: absolute; left: calc(100% + 12px); top: 50%; transform: translateY(-50%);
  background: #12233C; color: #fff;
  padding: 7px 12px; border-radius: 8px;
  font-weight: 600; font-size: 12.5px; white-space: nowrap;
  box-shadow: var(--shadow-md);
  opacity: 0; pointer-events: none; visibility: hidden;
  transition: opacity .15s ease; z-index: 320;
}
.sidebar.collapsed:not(.peek) .nav-item:hover::after { opacity: 1; visibility: visible; }

.sidebar-footer { padding: 14px 18px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 11px; color: rgba(255,255,255,0.3); }
.sidebar.collapsed .sidebar-footer { padding: 14px 0; text-align: center; }

/* Mobile toggle */
.side-toggle {
  display: none; position: fixed; top: 14px; left: 14px; z-index: 301;
  width: 38px; height: 38px; border-radius: 10px;
  background: var(--gray-900); border: 1px solid rgba(255,255,255,0.12);
  align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 19px;
}
.side-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 250; }

/* ===== MAIN ===== */
.main { margin-left: var(--side-w); min-height: 100vh; position: relative; z-index: 1; transition: margin-left .25s ease; }
.sidebar.collapsed ~ .main { margin-left: var(--side-w-collapsed); }
.sidebar.collapsed ~ .main .content { padding: 20px 20px 30px; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 32px; background: white; border-bottom: 1px solid var(--gray-200);
  position: sticky; top: 0; z-index: 50;
}
.topbar h2 { font-size: 20px; font-weight: 700; color: var(--gray-900); }
.topbar .actions { display: flex; gap: 8px; align-items: center; }
.sync-status {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--gray-500); cursor: pointer; padding: 4px 10px;
  border-radius: 20px; border: 1px solid var(--gray-200); background: white;
  transition: all var(--transition); user-select: none;
}
.sync-status:hover { border-color: var(--gray-300); background: var(--gray-50); }
.sync-status .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.sync-status .dot.green { background: var(--success); }
.sync-status .dot.gray { background: var(--gray-400); }
.sync-status .dot.orange { background: var(--warning); }
.sync-status .dot.pulse { animation: dotPulse 1.2s ease-in-out infinite; }
@keyframes dotPulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.content { padding: 20px 24px 30px; overflow:visible; }

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 20px;
  border-radius: var(--radius-xs); font-size: 13px; font-weight: 600;
  border: none; cursor: pointer; transition: all var(--transition);
  font-family: inherit; text-decoration: none;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-success { background: var(--success); color: white; }
.btn-success:hover { background: #059669; }
.btn-danger { background: var(--danger); color: white; }
.btn-danger:hover { background: #dc2626; }
.btn-ghost { background: transparent; color: var(--gray-600); }
.btn-ghost:hover { background: var(--gray-100); color: var(--gray-800); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-outline { background: white; color: var(--gray-700); border: 1px solid var(--gray-300); }
.btn-outline:hover { background: var(--gray-50); border-color: var(--gray-400); }
.btn-icon {
  width: 36px; height: 36px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--radius-xs); border: none; cursor: pointer; transition: all var(--transition);
  font-size: 16px;
}
.btn-icon:hover { background: var(--gray-100); transform: translateY(-1px); }
.btn-icon.edit:hover { background: var(--primary-bg); color: var(--primary); }
.btn-icon.delete:hover { background: var(--danger-bg); color: var(--danger); }

/* ===== CARDS ===== */
.card {
  background: white; border-radius: var(--radius); border: 1px solid var(--gray-200);
  box-shadow: var(--shadow); overflow: visible;
}
.card-header {
  padding: 14px 18px; border-bottom: 1px solid var(--gray-200);
  display: flex; align-items: center; justify-content: space-between;
}
.card-header h3 { font-size: 14px; font-weight: 600; }
.card-body { padding: 14px 18px; }
.card-footer { padding: 14px 24px; border-top: 1px solid var(--gray-200); background: var(--gray-50); }

/* ===== STAT CARDS ===== */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
.stat-card {
  background: white; border-radius: var(--radius); padding: 16px 18px;
  border: 1px solid var(--gray-200); box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start;
  transition: all var(--transition); min-height: 100px; position: relative;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.stat-card .icon-wrap {
  width: 36px; height: 36px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
}
.stat-card .info { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
.stat-card .info .label { font-size: 13px; color: var(--gray-500); font-weight: 500; }
.stat-card .info .value { font-size: 26px; font-weight: 800; color: var(--gray-900); letter-spacing: -1px; margin-top: 2px; }
.stat-card .info .sub { font-size: 12px; color: var(--gray-400); margin-top: 2px; }

/* ===== TABLES ===== */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead th {
  text-align: left; padding: 10px 16px; font-size: 12px; font-weight: 600;
  color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.5px;
  background: var(--gray-50); border-bottom: 1px solid var(--gray-200); white-space: nowrap;
}
tbody td {
  padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--gray-100); color: var(--gray-700);
  transition: background var(--transition);
}
tbody tr:hover td { background: var(--gray-50); }
tbody tr:last-child td { border-bottom: none; }
.price-cell { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }

/* Coluna "Produto" fixa ao rolar a tabela para o lado (Produtos e Tabela de Preços) */
.table-sticky-col th:first-child,
.table-sticky-col td:first-child {
  position: sticky; left: 0; z-index: 2;
  background: var(--gray-50);
  box-shadow: 1px 0 0 var(--gray-200);
}
.table-sticky-col tbody td:first-child { background: white; }
.table-sticky-col tbody tr:hover td:first-child { background: var(--gray-50); }

/* ===== STATUS BADGES ===== */
.badge {
  display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
}
.badge-success { background: var(--success-bg); color: #065f46; }
.badge-warning { background: var(--warning-bg); color: #92400e; }
.badge-danger { background: var(--danger-bg); color: #991b1b; }
.badge-info { background: var(--primary-bg); color: var(--primary-dark); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(15,23,42,0.5); backdrop-filter: blur(4px);
  z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px;
  animation: fadeIn 0.2s ease;
}
.modal-overlay.open { display: flex; }
.modal {
  background: white; border-radius: var(--radius); width: 100%; max-width: 560px;
  max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-xl);
  animation: slideUp 0.25s ease;
}
.modal.wide { max-width: 720px; }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px; border-bottom: 1px solid var(--gray-200);
  position: sticky; top: 0; background: white; z-index: 1;
}
.modal-header h3 { font-size: 16px; font-weight: 700; }
.modal-close {
  width: 32px; height: 32px; border: none; background: none; cursor: pointer;
  border-radius: var(--radius-xs); font-size: 18px; color: var(--gray-400);
  display: flex; align-items: center; justify-content: center; transition: all var(--transition);
}
.modal-close:hover { background: var(--gray-100); color: var(--gray-700); }
.modal-body { padding: 14px 24px; }
.modal-footer {
  display: flex; align-items: center; justify-content: flex-end; gap: 10px;
  padding: 16px 24px; border-top: 1px solid var(--gray-200); background: var(--gray-50);
}

/* ===== FORM ===== */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-grid .full { grid-column: 1 / -1; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label { font-size: 12px; font-weight: 600; color: var(--gray-600); }
.form-group input, .form-group select, .form-group textarea {
  padding: 7px 12px; border: 1px solid var(--gray-300); border-radius: var(--radius-xs);
  font-size: 13px; font-family: inherit; transition: all var(--transition);
  background: white; color: var(--gray-900);
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
}
.form-group input::placeholder { color: var(--gray-400); }
.form-group .hint { font-size: 11px; color: var(--gray-400); }

/* ===== SEARCH ===== */
.search-box {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; background: white; border: 1px solid var(--gray-300);
  border-radius: var(--radius-xs); transition: all var(--transition);
  flex: 1; max-width: 320px;
}
.search-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
.search-box input { border: none; background: none; outline: none; font-size: 13px; flex: 1; font-family: inherit; }
.search-box .icon { color: var(--gray-400); font-size: 16px; }

/* ===== TABS ===== */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--gray-200); margin-bottom: 20px; }
.tab {
  padding: 10px 20px; font-size: 13px; font-weight: 500; color: var(--gray-500);
  cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent;
  transition: all var(--transition); font-family: inherit;
}
.tab:hover { color: var(--gray-700); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }

/* ===== TOAST ===== */
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 14px 20px; border-radius: var(--radius-sm); background: white; box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500;
  border-left: 4px solid var(--primary); min-width: 280px; animation: slideIn 0.3s ease;
}
.toast.success { border-left-color: var(--success); }
.toast.error { border-left-color: var(--danger); }
.toast .icon { font-size: 18px; }
.toast .close { margin-left: auto; background: none; border: none; cursor: pointer; font-size: 16px; color: var(--gray-400); }

/* ===== EMPTY STATE ===== */
.empty-state { text-align: center; padding: 48px 20px; color: var(--gray-400); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state h4 { font-size: 16px; color: var(--gray-600); font-weight: 600; margin-bottom: 4px; }
.empty-state p { font-size: 13px; }

/* ===== PAGINATION ===== */
.pagination { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 0; font-size: 13px; color: var(--gray-500); }
.pagination .pages { display: flex; gap: 4px; }
.pagination .pages button {
  width: 32px; height: 32px; border: 1px solid var(--gray-300); border-radius: var(--radius-xs);
  background: white; cursor: pointer; font-size: 13px; transition: all var(--transition); font-family: inherit;
}
.pagination .pages button:hover { background: var(--gray-50); border-color: var(--gray-400); }
.pagination .pages button.active { background: var(--primary); color: white; border-color: var(--primary); }

/* ===== CLIENT SELECT ===== */
.client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.client-card {
  padding: 16px 18px; border: 1px solid var(--gray-200); border-radius: var(--radius-sm);
  cursor: pointer; transition: all var(--transition); background: white;
  display: flex; align-items: center; gap: 12px;
}
.client-card:hover { border-color: var(--primary-light); box-shadow: var(--shadow-md); }
.client-card.selected { border-color: var(--primary); background: var(--primary-bg); box-shadow: 0 0 0 2px rgba(79,70,229,0.15); }
.client-card .avatar {
  width: 40px; height: 40px; border-radius: 50%; background: var(--primary-bg); color: var(--primary);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0;
}
.client-card .info h4 { font-size: 13px; font-weight: 600; }
.client-card .info p { font-size: 12px; color: var(--gray-500); }

/* ===== PRICE TABLE ===== */
.price-control { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
.price-control input {
  width: 100px; padding: 5px 8px; border: 1px solid var(--gray-300); border-radius: var(--radius-xs);
  font-size: 13px; text-align: right; font-family: inherit; transition: all var(--transition);
}
.price-control input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(79,70,229,0.1); }
.price-control .save-btn {
  padding: 5px 10px; font-size: 11px; font-weight: 600; border-radius: var(--radius-xs);
  border: none; background: var(--primary); color: white; cursor: pointer; transition: all var(--transition);
  font-family: inherit; white-space: nowrap;
}
.price-control .save-btn:hover { background: var(--primary-dark); }

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); box-shadow: var(--shadow-xl); }
  body.side-open .sidebar { transform: translateX(0); }
  body.side-open .side-overlay { display: block; }
  .side-toggle { display: flex; }
  .main { margin-left: 0 !important; }
  .content { padding: 16px; }
  .topbar { padding: 12px 16px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .charts-grid { grid-template-columns: 1fr !important; }
  .form-grid { grid-template-columns: 1fr; }
  .modal { max-width: 100%; margin: 10px; }
  .client-grid { grid-template-columns: 1fr; }

  html, body { overflow-x: hidden; max-width: 100vw; }
  .topbar h2 { font-size: 16px; }
  .topbar .actions { flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .stats-grid { gap: 12px; }
  .stat-card { padding: 16px; gap: 12px; }
  .stat-card .icon-wrap { width: 40px; height: 40px; font-size: 18px; }
  .stat-card .info .value { font-size: 20px; }
  .card-header { padding: 14px 16px; flex-wrap: wrap; gap: 8px; }
  .card-body { padding: 14px 16px; }
  .search-box { max-width: 100%; }
}
.side-toggle {
  display: none; position: fixed; top: 14px; left: 14px; z-index: 301;
  width: 38px; height: 38px; border-radius: 10px;
  background: var(--gray-900); border: 1px solid rgba(255,255,255,0.12);
  align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 19px;
}
@media (max-width: 900px) { .side-toggle { display: flex; } }

/* ===== ANIMATIONS ===== */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideIn { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }


/* ===== GRID EDITAVEL ===== */
.grid-contas-wrap { border:1px solid var(--gray-200); border-radius:var(--radius); background:white; overflow:hidden; }
.grid-contas { width:100%; border-collapse:collapse; table-layout:fixed; }
.grid-contas thead th {
  text-align:left; padding:6px 4px; font-size:10px; font-weight:600;
  color:var(--gray-500); text-transform:uppercase; letter-spacing:0.3px;
  background:var(--gray-50); border-bottom:2px solid var(--gray-200); white-space:nowrap;
  position:sticky; top:0; z-index:2;
}
.grid-contas tbody td {
  padding:2px 3px; border-bottom:1px solid var(--gray-100); vertical-align:middle; overflow:visible; position:relative;
}
.grid-contas tbody tr:hover td { background:var(--primary-bg); }

.grid-contas input, .grid-contas select, .grid-contas textarea {
  width:100%; padding:4px 5px; border:1px solid transparent; border-radius:var(--radius-xs);
  font-size:11px; font-family:inherit; background:transparent; color:var(--gray-900);
  transition:all 0.15s;
}
.grid-contas input:focus, .grid-contas select:focus, .grid-contas textarea:focus {
  outline:none; border-color:var(--primary); background:white;
  box-shadow:0 0 0 2px rgba(79,70,229,0.12);
}
.grid-contas input:hover, .grid-contas select:hover { background:var(--gray-50); border-color:var(--gray-300); }
.grid-contas input[readonly], .grid-contas select[disabled] { background:var(--gray-50); color:var(--gray-500); cursor:not-allowed; opacity:0.7; }
.grid-contas input[readonly]:focus, .grid-contas select[disabled]:focus { border-color:transparent; box-shadow:none; background:var(--gray-50); }
.grid-contas input[readonly] { background:var(--gray-100); font-weight:700; color:var(--gray-700); cursor:default; }
.grid-contas .col-titulo { width:12%; }
.grid-contas .col-forn { width:21%; }

/* Coluna Fornecedor: select + botão "novo fornecedor" lado a lado, sem vazar da célula.

   da coluna (table-layout:fixed); o flex fica só no <div> interno. */

const AUTH_FN_URL = SUPABASE_URL + '/functions/v1/auth-users';
async function callAuthFn(payload) {

// ============================================================
// SESSÃO DE AUTENTICAÇÃO REAL (Supabase Auth)
// Sem essa sessão válida, as políticas de RLS (configuradas para exigir
// auth.role() = 'authenticated') bloqueiam qualquer leitura/gravação —
// mesmo que a pessoa tenha o arquivo HTML e a chave anônima.
// ============================================================
function getAuthSession() {
  try { return JSON.parse(localStorage.getItem('tbp_auth_session') || 'null'); } catch(e) { return null; }
}
function saveAuthSession(session) {
  if (session) localStorage.setItem('tbp_auth_session', JSON.stringify(session));
  else localStorage.removeItem('tbp_auth_session');
}

async function supabaseAuthLogin(email, senha) {
  const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
    body: JSON.stringify({ email: email, password: senha })
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error_description || data.msg || data.error || 'Falha na autenticação');
  return data;
}

async function supabaseAuthRefresh(refresh_token) {
  const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
    body: JSON.stringify({ refresh_token: refresh_token })
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error_description || data.msg || data.error || 'Falha ao renovar sessão');
  return data;
}

async function supabaseAuthLogout() {
  var session = getAuthSession();
  saveAuthSession(null);
  if (!session) return;
  try {
    await fetch(SUPABASE_URL + '/auth/v1/logout', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + session.access_token }
    });
  } catch(e) { /* não bloqueia o logout local se o servidor não responder */ }
}

// Retorna um access_token válido, renovando via refresh_token quando
// estiver perto de expirar. Se a renovação falhar de vez (sessão expirada
// há muito tempo), força o usuário a logar de novo.
async function getValidAccessToken() {
  var session = getAuthSession();
  if (!session) return null;
  var now = Math.floor(Date.now() / 1000);
  if (!session.expires_at || session.expires_at - now < 60) {
    try {
      var refreshed = await supabaseAuthRefresh(session.refresh_token);
      var newSession = {
        access_token: refreshed.access_token,
        refresh_token: refreshed.refresh_token,
        expires_at: refreshed.expires_at || (Math.floor(Date.now() / 1000) + (refreshed.expires_in || 3600))
      };
      saveAuthSession(newSession);
      return newSession.access_token;
    } catch(e) {
      console.warn('Falha ao renovar sessão Supabase Auth:', e.message);
      saveAuthSession(null);
      if (currentUser) {
        toast('Sua sessão expirou. Faça login novamente.', 'error');
        doLogout();
      }
      return null;
    }
  }
  return session.access_token;
}

const SB = {
  async _headers() {
    const token = await getValidAccessToken();
    return {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + (token || SUPABASE_KEY),
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates'
    };
  },
  async get(table) {
    const headers = await this._headers();
    const r = await fetch(SUPABASE_URL + '/rest/v1/' + table + '?select=*', { headers: headers });
    if (!r.ok) { const t = await r.text(); throw new Error('Supabase GET ' + table + ' (' + r.status + '): ' + t); }
    return r.json();
  },
  async upsert(table, rows) {
    if (!rows || rows.length === 0) return;
    const headers = await this._headers();
    const r = await fetch(SUPABASE_URL + '/rest/v1/' + table, {
      method: 'POST',
      headers: { ...headers, 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify(rows)
    });
    if (!r.ok) { const t = await r.text(); throw new Error('Supabase UPSERT ' + table + ': ' + t); }
  },
  async delete(table, id) {
    const headers = await this._headers();
    const r = await fetch(SUPABASE_URL + '/rest/v1/' + table + '?id=eq.' + id, {
      method: 'DELETE',
      headers: headers
    });
    if (!r.ok) throw new Error('Supabase DELETE ' + table + ': ' + r.status);
  }
};

async function sbSave() {
  // Cada tabela é salva de forma independente: um erro em uma tabela
  // NÃO impede que as demais (ex: contas_a_pagar) sejam salvas.
  const erros = [];

  // Salva produtos

      sub_grupo: p.sub_grupo || '', preco_base: p.preco_base || 0,
      _deleted: p._deleted || false, updated_at: new Date().toISOString()
    }));
    if (produtos.length) await SB.upsert('produtos', produtos);
  } catch(e) { erros.push('produtos'); console.warn('Supabase save error [produtos]:', e.message); }

  // Salva clientes
  try {
    const clientes = state.clients.map(c => ({
      id: c.id, doc: c.doc || '', nome: c.nome || '', fantasia: c.fantasia || '',
      email: c.email || '', telefone: c.telefone || '', cep: c.cep || '',
      logradouro: c.logradouro || '', numero: c.numero || '', complemento: c.complemento || '',
      bairro: c.bairro || '', cidade: c.cidade || '', uf: c.uf || '',
      _deleted: c._deleted || false, updated_at: new Date().toISOString()
    }));
    if (clientes.length) await SB.upsert('clientes', clientes);
  } catch(e) { erros.push('clientes'); console.warn('Supabase save error [clientes]:', e.message); }

  // Salva precos
  try {
    const precos = Object.entries(state.prices).map(([key, preco]) => {
      const [cliente_id, produto_id] = key.split('_');
      return { id: key, cliente_id, produto_id, preco, updated_at: new Date().toISOString() };
    });
    if (precos.length) await SB.upsert('precos', precos);
  } catch(e) { erros.push('precos'); console.warn('Supabase save error [precos]:', e.message); }

  // Salva atribuicoes
  try {
    const atribuicoes = [];
    Object.entries(state.assigned).forEach(([cliente_id, produto_ids]) => {
      (produto_ids || []).forEach(produto_id => {
        atribuicoes.push({
          id: cliente_id + '_' + produto_id,
          cliente_id, produto_id,
          updated_at: new Date().toISOString()
        });
      });
    });
    if (atribuicoes.length) await SB.upsert('atribuicoes', atribuicoes);

  // Salva fornecedores

    console.warn('Supabase save error [fornecedores]:', e.message);
    toast('Falha ao sincronizar Fornecedores com o servidor: ' + e.message, 'error');

  // Salva contas a pagar

      id: c.id, titulo: c.titulo || '', fornecedor_id: c.fornecedor_id || '',

      observacao: c.observacao || '',
      _deleted: c._deleted || false, updated_at: new Date().toISOString()
    }));
    if (contas.length) await SB.upsert('contas_a_pagar', contas);
  } catch(e) {
    erros.push('contas_a_pagar');
    console.warn('Supabase save error [contas_a_pagar]:', e.message);
    toast('Falha ao sincronizar Contas a Pagar com o servidor: ' + e.message, 'error');
  }

  // Salva pedidos de venda (uma linha por item do pedido)
  try {
    const pedidos = state.pedidosVenda.map(p => ({
      id: p.id, pedido_id: p.pedido_id, cliente_id: p.cliente_id || '',
      numero_pedido: p.numero_pedido || '', data_pedido: p.data_pedido || '',
      data_entrega: p.data_entrega || '', produto_id: p.produto_id || '',
      qtd: p.qtd || 0, valor_unitario: p.valor_unitario || 0, valor_total: p.valor_total || 0,

      obs_status: p.obs_status || '',

  // Salva contas a receber
  try {
    const receb = state.contasAReceber.map(c => ({
      id: c.id, tipo: c.tipo || 'NORMAL', pedido_id: c.pedido_id || '', cliente_id: c.cliente_id || '',
      titulo: c.titulo || '', data_vencimento: c.data_vencimento || null,
      data_recebimento: c.data_recebimento || null, valor_bruto: c.valor_bruto || 0,
      valor_pago: c.valor_pago || 0, valor_utilizado: c.valor_utilizado || 0,

  }

  // Salva cheques (controle de cheques recebidos)
  try {
    const cheques = state.cheques.map(c => ({
      id: c.id, conta_receber_id: c.conta_receber_id || '', cliente_id: c.cliente_id || '',

      status: c.status || 'EM_CARTEIRA', observacao: c.observacao || '',

    if (cheques.length) await SB.upsert('cheques', cheques);

    erros.push('cheques');
    console.warn('Supabase save error [cheques]:', e.message);
    toast('Falha ao sincronizar Controle de Cheques com o servidor: ' + e.message, 'error');

  // Salva operações de desconto/cessão de recebíveis com FIDC
  try {
    const fidc = (state.operacoesFidc || []).map(o => ({

    if (fidc.length) await SB.upsert('operacoes_fidc', fidc);
  } catch(e) {
    erros.push('operacoes_fidc');
    console.warn('Supabase save error [operacoes_fidc]:', e.message);
  }

  if (erros.length === 0) {
    console.log('Supabase: dados salvos com sucesso');
  } else {
    console.warn('Supabase: falha ao salvar as tabelas: ' + erros.join(', '));
  }
}

async function sbLoad() {

    let fornecedoresErro = '';
    let contasFalhou = false;
    let pedidosFalhou = false;
    let recebFalhou = false;
    let chequesFalhou = false;
    let fidcFalhou = false;
    const [produtos, clientes, precos, atribuicoes, fornecedores, contas, pedidos, recebiveis, cheques, fidcOps] = await Promise.all([
      SB.get('produtos'),
      SB.get('clientes'),
      SB.get('precos'),
      SB.get('atribuicoes'),
      SB.get('fornecedores').catch(e => { fornecedoresFalhou = true; fornecedoresErro = e.message; console.warn('Supabase GET fornecedores falhou:', e.message); return []; }),
      SB.get('contas_a_pagar').catch(e => { contasFalhou = true; console.warn('Supabase GET contas_a_pagar falhou:', e.message); return []; }),
      SB.get('pedidos_venda').catch(e => { pedidosFalhou = true; console.warn('Supabase GET pedidos_venda falhou:', e.message); return []; }),
      SB.get('contas_a_receber').catch(e => { recebFalhou = true; console.warn('Supabase GET contas_a_receber falhou:', e.message); return []; }),
      SB.get('cheques').catch(e => { chequesFalhou = true; console.warn('Supabase GET cheques falhou:', e.message); return []; }),
      SB.get('operacoes_fidc').catch(e => { fidcFalhou = true; console.warn('Supabase GET operacoes_fidc falhou:', e.message); return []; })
    ]);

    if (fornecedoresFalhou) {
      toast('Não foi possível buscar Fornecedores no servidor (' + fornecedoresErro + '). Mantendo os dados salvos neste dispositivo.', 'error');

        try { contasIds = typeof o.contas_ids === 'string' ? JSON.parse(o.contas_ids) : (o.contas_ids || []); } catch(e) { contasIds = []; }
        return {
          id: o.id, fidc_nome: o.fidc_nome, data_operacao: o.data_operacao, contas_ids: contasIds,
          valor_face: o.valor_face, taxa_desconto: o.taxa_desconto, valor_desconto: o.valor_desconto,
          valor_liquido: o.valor_liquido, conta_recebimento: o.conta_recebimento,
          status: o.status, observacao: o.observacao, _deleted: o._deleted
        };
      });
    }

    migrateClients(state.clients);
    console.log('Supabase: ' + clientes.length + ' clientes, ' + produtos.length + ' produtos, ' + precos.length + ' precos, ' + fornecedores.length + ' fornecedores, ' + contas.length + ' contas carregados');
    return true;
  } catch(e) {
    console.warn('Supabase load error:', e.message);
    return false;
  }
}

// Saldo de crédito (adiantamentos) ainda não utilizado de um cliente.
function getSaldoAdiantamento(clienteId) {
  return getActiveRecebiveis()
    .filter(function(c) { return c.tipo === 'ADIANTAMENTO' && c.cliente_id === clienteId && c.status !== 'CANCELADO'; })
    .reduce(function(s, c) { return s + Math.max(0, (parseFloat(c.valor_bruto) || 0) - (parseFloat(c.valor_utilizado) || 0)); }, 0);
}

// Consome o crédito de adiantamento de um cliente (do mais antigo para o mais
// novo) até o valor solicitado. Retorna o valor efetivamente aplicado.
function aplicarAdiantamento(clienteId, valorDesejado) {
  var restante = parseFloat(valorDesejado) || 0;
  if (restante <= 0) return 0;
  var aplicado = 0;
  var adiantamentos = getActiveRecebiveis()
    .filter(function(c) { return c.tipo === 'ADIANTAMENTO' && c.cliente_id === clienteId && c.status !== 'CANCELADO'; })
    .sort(function(a, b) { return (a.data_recebimento || '').localeCompare(b.data_recebimento || ''); });
  adiantamentos.forEach(function(c) {
    if (restante <= 0) return;
    var disponivel = Math.max(0, (parseFloat(c.valor_bruto) || 0) - (parseFloat(c.valor_utilizado) || 0));
    if (disponivel <= 0) return;
    var usar = Math.min(disponivel, restante);
    c.valor_utilizado = (parseFloat(c.valor_utilizado) || 0) + usar;
    restante -= usar;
    aplicado += usar;
  });
  return aplicado;
}

function recalcAllRecebiveisStatus() {
  var mudou = false;
  (state.contasAReceber || []).forEach(function(c) {
    if (c._deleted) return;
    if (c.tipo === 'ADIANTAMENTO') return;
    if (c.status === 'RECEBIDO' || c.status === 'RECEBIDO_PARCIALMENTE' || c.status === 'CANCELADO' || c.status === 'DESCONTADO_FIDC' || c.status === 'LIQUIDADO_FIDC') return;
    var novo = calcStatus(c.data_vencimento, c.data_recebimento);
    if (novo !== c.status) { c.status = novo; mudou = true; }
  });
  return mudou;
}
function getPedidosAgrupados() {
  // Agrupa os itens (linhas) por pedido_id, retornando um registro por pedido
  var itens = getActivePedidoItens();
  var map = {};
  var ordem = [];
  itens.forEach(function(it) {
    if (!map[it.pedido_id]) { map[it.pedido_id] = []; ordem.push(it.pedido_id); }
    map[it.pedido_id].push(it);
  });
  return ordem.map(function(pid) {
    var linhas = map[pid];
    var first = linhas[0];
    return {
      pedido_id: pid,
      cliente_id: first.cliente_id,
      numero_pedido: first.numero_pedido,
      data_pedido: first.data_pedido,
      data_entrega: first.data_entrega,
      status_pedido: first.status_pedido || 'PENDENTE',
      data_status: first.data_status || '',
      obs_status: first.obs_status || '',
      itens: linhas,
      valor_pedido: linhas.reduce(function(s, it) { return s + (parseFloat(it.valor_total) || 0); }, 0)
    };
  });
}
function calcValorTotal(valorBruto, jurosMulta, desconto) {
  return (parseFloat(valorBruto) || 0) + (parseFloat(jurosMulta) || 0) - (parseFloat(desconto) || 0);
}

// ===== STORAGE (localStorage + IndexedDB + Cookies) =====
var _db = null;
function _openDB() {
  return new Promise(function(resolve, reject) {
    if (_db) { resolve(_db); return; }
    var req = indexedDB.open('dashboard_preco', 1);
    req.onupgradeneeded = function(e) {
      var d = e.target.result;
      if (!d.objectStoreNames.contains('data')) {
        d.createObjectStore('data', { keyPath: 'id' });
      }
    };
    req.onsuccess = function(e) { _db = e.target.result; resolve(_db); };
    req.onerror = function() { reject(req.error); };
  });
}
function _dbSave(data) {
  try { return _openDB().then(function(d) {
    return new Promise(function(resolve, reject) {
      var tx = d.transaction('data', 'readwrite');
      tx.objectStore('data').put({ id: 'main', data: data });
      tx.oncomplete = resolve;
      tx.onerror = function() { reject(tx.error); };
    });
  }); } catch(e) { return Promise.resolve(); }
}
function _dbLoad() {
  try { return _openDB().then(function(d) {
    return new Promise(function(resolve, reject) {
      var tx = d.transaction('data', 'readonly');
      var req = tx.objectStore('data').get('main');
      req.onsuccess = function() { resolve(req.result ? req.result.data : null); };
      req.onerror = function() { reject(req.error); };
    });
  }); } catch(e) { return Promise.resolve(null); }
}
function _cookieSave(data) {
  try {
    var str = encodeURIComponent(JSON.stringify(data));
    var max = 3500;
    document.cookie = STORAGE_KEY + '_len=' + str.length + ';path=/';
    for (var i = 0; i < str.length; i += max) {
      var chunk = str.slice(i, i + max);
      document.cookie = STORAGE_KEY + '_' + Math.floor(i / max) + '=' + chunk + ';path=/';
    }
  } catch(e) { console.warn('Cookie save error:', e); }
}
function _cookieLoad() {
  try {
    var matchLen = document.cookie.match(new RegExp('(?:^|; )' + STORAGE_KEY + '_len=([^;]*)'));
    if (!matchLen) return null;
    var total = parseInt(matchLen[1], 10);
    if (!total) return null;
    var max = 3500;
    var parts = [];
    for (var i = 0; i < total; i += max) {
      var idx = Math.floor(i / max);
      var m = document.cookie.match(new RegExp('(?:^|; )' + STORAGE_KEY + '_' + idx + '=([^;]*)'));
      if (!m) return null;
      parts.push(m[1]);
    }
    return JSON.parse(decodeURIComponent(parts.join('')));
  } catch(e) { return null; }
}

function _applyState(saved) {
  state.clients = saved.clients || [];
  state.products = saved.products || [];
  state.prices = saved.prices || {};
  state.assigned = saved.assigned || {};
  state.fornecedores = saved.fornecedores || [];
  state.contasAPagar = saved.contasAPagar || [];
  state.pedidosVenda = saved.pedidosVenda || [];
  state.contasAReceber = saved.contasAReceber || [];
  state.cheques = saved.cheques || [];
  state.operacoesFidc = saved.operacoesFidc || [];
  migrateClients(state.clients);
}

async function loadState() {
  try {
    // Carrega o cache local primeiro como base. Assim, se alguma tabela
    // (ex: contas_a_pagar) falhar ao buscar do Supabase, os dados salvos
    // neste dispositivo não são apagados.
    var rawInicial = localStorage.getItem(STORAGE_KEY);
    if (rawInicial) {
      try { _applyState(JSON.parse(rawInicial)); } catch(e) { console.warn('Erro ao aplicar cache local inicial:', e); }
    }

    // Tenta carregar do Supabase (fonte principal - compartilhada entre usuários)
    var sbOk = await sbLoad();
    if (sbOk) {
      // Recalcula o status (A Vencer / Vencido) de todas as contas em aberto
      // com base na data de hoje, corrigindo títulos que venceram desde o
      // último acesso e ficariam presos como "A Vencer".
      var statusMudou = recalcAllContasStatus();
      var statusMudouReceb = recalcAllRecebiveisStatus();
      // Atualiza localStorage com os dados atuais (Supabase + eventuais campos preservados do cache)
      var data = { clients: state.clients, products: state.products, prices: state.prices, assigned: state.assigned, fornecedores: state.fornecedores, contasAPagar: state.contasAPagar, pedidosVenda: state.pedidosVenda, contasAReceber: state.contasAReceber, cheques: state.cheques, operacoesFidc: state.operacoesFidc };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      if (statusMudou || statusMudouReceb) sbSave().catch(function(e) { console.warn('sbSave (recalc status):', e); });
      return;
    }
    // Fallback: localStorage (offline ou Supabase indisponível)
    if (rawInicial) {
      recalcAllContasStatus();
      recalcAllRecebiveisStatus();
      console.log('localStorage (offline): ' + Object.keys(state.prices).length + ' precos');
      return;
    }
    // Fallback: IndexedDB
    var saved = await _dbLoad();
    if (saved) {
      _applyState(saved);
      recalcAllContasStatus();
      recalcAllRecebiveisStatus();
      console.log('IndexedDB: ' + Object.keys(state.prices).length + ' precos');
      return;
    }
    console.log('Nenhum dado encontrado');
  } catch (e) { console.warn('Erro ao carregar:', e); }
}
function migrateClients(clients) {
  clients.forEach(c => {
    if (c.endereco && !c.logradouro) {
      const parts = c.endereco.split(',').map(s => s.trim());
      c.logradouro = parts[0] || '';
      c.numero = parts[1] || '';
      c.complemento = parts[2] || '';
      c.bairro = parts[3] || '';
      c.cidade = parts[4] || '';
      c.uf = parts[5] || '';
      delete c.endereco;
    }
  });
}
function saveState() {
  try {
    var data = {
      clients: state.clients,
      products: state.products,
      prices: state.prices,
      assigned: state.assigned,
      fornecedores: state.fornecedores,
      contasAPagar: state.contasAPagar,
      pedidosVenda: state.pedidosVenda,
      contasAReceber: state.contasAReceber,
      cheques: state.cheques,
      operacoesFidc: state.operacoesFidc
    };
    console.log('Salvando:', Object.keys(state.prices).length + ' precos, ' + state.contasAPagar.length + ' contas, ' + state.pedidosVenda.length + ' itens de pedidos, ' + state.contasAReceber.length + ' recebiveis, ' + state.cheques.length + ' cheques, ' + (state.operacoesFidc||[]).length + ' op. FIDC');
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    _dbSave(data);
    _cookieSave(data);
    // Salva no Supabase em paralelo (não bloqueia a UI)
    sbSave().catch(e => console.warn('sbSave:', e));
  } catch (e) { console.warn('Erro ao salvar:', e); }
}

// ============================================================
// SIDEBAR BEHAVIOR
// ============================================================
(function() {
  const sidebar = document.getElementById('sidebar');
  const toggle = document.getElementById('side-toggle');
  let lastOpenMenu = null;

  function getActiveMenu() {
    const activeBtn = document.querySelector('.nav-item.active[data-tab]');
    if (activeBtn) {
      const parent = activeBtn.closest('.side-item[data-menu]');
      if (parent) return parent.getAttribute('data-menu');
    }
    return null;
  }

  // Submenu toggle
  document.querySelectorAll('.side-item[data-menu]').forEach(item => {
    const btn = item.querySelector('.nav-item');
    btn.addEventListener('click', () => {
      if (sidebar.classList.contains('collapsed')) {
        sidebar.classList.remove('peek');
        expandSidebar();
        document.querySelectorAll('.side-item').forEach(i => { if (i !== item) i.classList.remove('open'); });
        item.classList.add('open');
        return;
      }
      const wasOpen = item.classList.contains('open');
      document.querySelectorAll('.side-item').forEach(i => { if (i !== item) i.classList.remove('open'); });
      item.classList.toggle('open', !wasOpen);
    });
  });

  // Collapsed peek
  sidebar.addEventListener('mouseenter', () => {
    if (sidebar.classList.contains('collapsed')) {
      sidebar.classList.add('peek');
      const menuToShow = lastOpenMenu || getActiveMenu();
      if (menuToShow) {
        const item = document.querySelector(`.side-item[data-menu="${menuToShow}"]`);
        if (item) item.classList.add('open');
      }
    }
  });
  sidebar.addEventListener('mouseleave', () => {
    if (sidebar.classList.contains('collapsed')) {
      const openItem = document.querySelector('.side-item.open');
      lastOpenMenu = openItem ? openItem.getAttribute('data-menu') : lastOpenMenu;
      document.querySelectorAll('.side-item.open').forEach(i => i.classList.remove('open'));
    }
    sidebar.classList.remove('peek');
  });

  // Mobile toggle
  if (toggle) {
    toggle.addEventListener('click', () => document.body.classList.toggle('side-open'));
  }

  // Collapse/expand
  window.expandSidebar = function() {
    if (!sidebar.classList.contains('collapsed')) return;
    sidebar.classList.remove('collapsed');
    const menuToShow = lastOpenMenu || getActiveMenu();
    if (menuToShow) {
      const item = document.querySelector(`.side-item[data-menu="${menuToShow}"]`);
      if (item) item.classList.add('open');
    }
  };
  window.collapseSidebar = function() {
    sidebar.classList.add('collapsed');
    const openItem = document.querySelector('.side-item.open');
    lastOpenMenu = openItem ? openItem.getAttribute('data-menu') : lastOpenMenu;
    document.querySelectorAll('.side-item.open').forEach(i => i.classList.remove('open'));
  };
})();

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function formatMoney(v) {
  var n = parseFloat(v || 0);
  var parts = n.toFixed(2).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return 'R$ ' + parts.join(',');
}

function formatNumBR(v) {
  // When v is a string it may already be in BR format (comma as decimal
  // separator, e.g. "109,24") -- typically while the user is mid-edit.
  // parseFloat() alone would truncate at the comma and drop the decimals,
  // so route strings through parseNumBR() instead. Plain numbers (already
  // parsed floats) go straight through parseFloat as before.
  var n = (typeof v === 'string') ? parseNumBR(v) : (parseFloat(v) || 0);
  var parts = n.toFixed(2).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return parts.join(',');
}

function parseNumBR(s) {
  if (!s) return 0;
  return parseFloat(s.replace(/\./g, '').replace(',', '.')) || 0;
}
function numToPlainBR(n) {
  if (!n) return '';
  return String(n).replace('.', ',');
}
function formatOnInput(el) {
  var raw = el.value.replace(/\D/g, '');
  if (!raw) { el.value = ''; return; }
  if (raw.length <= 2) {
    el.value = raw;
  } else {
    var intPart = raw.slice(0, -2);
    var decPart = raw.slice(-2);
    intPart = parseInt(intPart, 10).toLocaleString('pt-BR');
    el.value = intPart + ',' + decPart;
  }
}
function parseMoney(v) { return parseFloat(String(v).replace(/[^0-9,.-]/g, '').replace(',', '.')) || 0; }
function cleanCPF_CNPJ(v) { return String(v).replace(/\D/g, ''); }
function maskCNPJ(v) {
  const d = cleanCPF_CNPJ(v).slice(0, 14);
  if (d.length <= 11) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
  return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
}
function truncate(str, n = 35) { return str && str.length > n ? str.slice(0, n) + '...' : str; }

function getClientPrice(clientId, productId) {

function setClientPrice(clientId, productId, value) {

// ============================================================
// CSV IMPORT
// ============================================================
function parseCSVLine(line, delim = ';') {
  const cols = []; let current = ''; let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQuotes && i + 1 < line.length && line[i + 1] === '"') { current += '"'; i++; }
      else { inQuotes = !inQuotes; }
    } else if (ch === delim && !inQuotes) { cols.push(current.trim()); current = ''; }
    else { current += ch; }
  }
  cols.push(current.trim());
  return cols;
}

function detectDelimiter(headerLine) {
  const sc = (headerLine.match(/;/g) || []).length;
  const tc = (headerLine.match(/\t/g) || []).length;
  return sc >= tc ? ';' : '\t';
}

function parseCSVText(text, showToast = true) {
  const semBom = text.replace(/^\uFEFF/, '');
  const normalizado = semBom.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = normalizado.split('\n').filter(l => l.trim());
  if (lines.length < 2) throw new Error('CSV vazio ou inválido (apenas ' + lines.length + ' linha(s))');
  const delim = detectDelimiter(lines[0]);
  const headers = parseCSVLine(lines[0], delim).map(h => h.toUpperCase().replace(/^"|"$/g, '').trim());
  const matchHeader = (aliases) => headers.findIndex(h => aliases.some(a => h === a || h === a + '\r' || h.replace(/[^A-Z0-9]/g, '') === a.replace(/[^A-Z0-9]/g, '')));
  const nomeIdx  = matchHeader(['PRODUTO', 'NOME', 'PRODUTO', 'DESCRICAO', 'DESCRIÇÃO', 'ITEM']);
  const tipoIdx  = matchHeader(['TIPO', 'TP']);
  const grupoIdx = matchHeader(['GRUPO', 'CATEGORIA', 'DEPARTAMENTO', 'SECAO', 'SEÇÃO']);
  const subIdx   = matchHeader(['SUB-GRUPO', 'SUBGRUPO', 'SUB', 'SUB_GRUPO', 'SUBGRUP']);
  const precoIdx = matchHeader(['PRECO', 'PREÇO', 'PRECO_BASE', 'PREÇO_BASE', 'VALOR', 'PRECO ', 'PREÇO ']);
  if (nomeIdx === -1) throw new Error('Coluna "PRODUTO" não encontrada. Cabeçalhos detectados: ' + headers.join(', '));
  let imported = 0, skipped = 0;
  const existing = new Set(state.products.map(p => p.nome.toUpperCase().trim()));
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCSVLine(lines[i], delim);
    const nome = cols[nomeIdx] || '';
    if (!nome || nome.toUpperCase().replace(/^"|"$/g, '').trim().startsWith('PRODUTO')) { skipped++; continue; }
    if (existing.has(nome.toUpperCase().trim())) { skipped++; continue; }
    const precoStr = precoIdx >= 0 ? (cols[precoIdx] || '0') : '0';
    const preco = parseFloat(String(precoStr).replace(',', '.').replace(/[^0-9.eE\-+]/g, '')) || 0;
    const up = v => v.toUpperCase();
    state.products.push({
      id: uid(),
      nome: up(nome.replace(/^"|"$/g, '').trim()),
      tipo: up(tipoIdx >= 0 ? (cols[tipoIdx] || '').replace(/^"|"$/g, '').trim() : ''),
      grupo: up(grupoIdx >= 0 ? (cols[grupoIdx] || '').replace(/^"|"$/g, '').trim() : ''),
      sub_grupo: up(subIdx >= 0 ? (cols[subIdx] || '').replace(/^"|"$/g, '').trim() : ''),
      preco_base: preco
    });
    existing.add(nome.toUpperCase().trim());
    imported++;
  }
  saveState();
  if (showToast) toast(`${imported} produtos importados! ${skipped} ignorados.`, imported > 0 ? 'success' : 'info');
  render();
}

async function fetchCSV(url) {
  const urlsTentar = [url];
  if (url.includes('docs.google.com/spreadsheets')) {
    urlsTentar.push(url.replace(/\/pub\?/, '/export?').replace(/&output=csv/, '&format=csv'));
    urlsTentar.push(url.replace(/\/pub\?.*/, '/export?format=csv'));
  }
  const proxies = [
    null,
    'https://api.allorigins.win/raw?url=',
    'https://corsproxy.io/?',
    'https://api.allorigins.io/raw?url='
  ];
  let lastError = '';
  for (const tentativa of urlsTentar) {
    for (const proxy of proxies) {
      try {
        const fullUrl = proxy ? proxy + encodeURIComponent(tentativa) : tentativa;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);
        const res = await fetch(fullUrl, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) { lastError = 'HTTP ' + res.status; continue; }
        const text = await res.text();
        if (text.includes('<!DOCTYPE') || text.includes('<html') || text.includes('Google Docs')) {
          lastError = 'Resposta HTML recebida (talvez precise publicar a planilha)'; continue;
        }
        if (text.split('\n').filter(l => l.trim()).length < 2) { lastError = 'CSV vazio'; continue; }
        return text;
      } catch (e) {
        lastError = e.name === 'AbortError' ? 'Tempo limite' : e.message;
        continue;
      }
    }
  }
  throw new Error(lastError);
}

function parseCSVProductText(text) {
  const semBom = text.replace(/^\uFEFF/, '');
  const normalizado = semBom.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = normalizado.split('\n').filter(l => l.trim());
  if (lines.length < 2) throw new Error('CSV vazio');
  const delim = detectDelimiter(lines[0]);
  const headers = parseCSVLine(lines[0], delim).map(h => h.toUpperCase().replace(/^"|"$/g, '').trim());
  const matchHeader = (aliases) => headers.findIndex(h => aliases.some(a => h === a || h === a + '\r' || h.replace(/[^A-Z0-9]/g, '') === a.replace(/[^A-Z0-9]/g, '')));
  const nomeIdx  = matchHeader(['PRODUTO', 'NOME', 'DESCRICAO', 'DESCRIÇÃO', 'ITEM']);
  const tipoIdx  = matchHeader(['TIPO', 'TP']);
  const grupoIdx = matchHeader(['GRUPO', 'CATEGORIA', 'DEPARTAMENTO', 'SECAO', 'SEÇÃO']);
  const subIdx   = matchHeader(['SUB-GRUPO', 'SUBGRUPO', 'SUB', 'SUB_GRUPO', 'SUBGRUP']);
  const precoIdx = matchHeader(['PRECO', 'PREÇO', 'PRECO_BASE', 'PREÇO_BASE', 'VALOR', 'PRECO ', 'PREÇO ']);
  if (nomeIdx === -1) throw new Error('Coluna "PRODUTO" não encontrada');
  let imported = 0, updated = 0;
  const nameMap = {};
  state.products.forEach(p => { nameMap[p.nome.toUpperCase().trim()] = p; });
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCSVLine(lines[i], delim);
    const nome = cols[nomeIdx] || '';
    if (!nome || nome.toUpperCase().replace(/^"|"$/g, '').trim().startsWith('PRODUTO')) continue;
    const key = nome.toUpperCase().trim();
    const precoStr = precoIdx >= 0 ? (cols[precoIdx] || '0') : '0';
    const preco = parseFloat(String(precoStr).replace(',', '.').replace(/[^0-9.eE\-+]/g, '')) || 0;
    const up = v => v.toUpperCase();
    const data = {
      nome: up(nome.replace(/^"|"$/g, '').trim()),
      tipo: up(tipoIdx >= 0 ? (cols[tipoIdx] || '').replace(/^"|"$/g, '').trim() : ''),
      grupo: up(grupoIdx >= 0 ? (cols[grupoIdx] || '').replace(/^"|"$/g, '').trim() : ''),
      sub_grupo: up(subIdx >= 0 ? (cols[subIdx] || '').replace(/^"|"$/g, '').trim() : ''),
      preco_base: preco
    };
    if (nameMap[key]) {
      Object.assign(nameMap[key], data);
      updated++;
    } else {
      state.products.push({ id: uid(), ...data });
      imported++;
    }
  }
  return { imported, updated };
}

function parseCSVClientsText(text) {
  const semBom = text.replace(/^\uFEFF/, '');
  const normalizado = semBom.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = normalizado.split('\n').filter(l => l.trim());
  if (lines.length < 2) throw new Error('CSV vazio');
  const delim = detectDelimiter(lines[0]);
  const headers = parseCSVLine(lines[0], delim).map(h => h.toUpperCase().replace(/^"|"$/g, '').trim());
  const matchHeader = (aliases) => headers.findIndex(h => aliases.some(a => h === a || h === a + '\r' || h.replace(/[^A-Z0-9]/g, '') === a.replace(/[^A-Z0-9]/g, '')));
  const docIdx    = matchHeader(['DOC', 'CNPJ', 'CPF', 'DOCUMENTO', 'DOCTO', 'CGCC', 'CNPJ_CPF']);
  const nomeIdx   = matchHeader(['NOME', 'RAZAO', 'RAZÃO', 'RAZAO SOCIAL', 'RAZÃO SOCIAL', 'CLIENTE']);
  const fantasiaIdx = matchHeader(['NOME_FANT', 'NOME_FANTASIA', 'FANTASIA', 'FANT']);
  const emailIdx  = matchHeader(['EMAIL', 'E-MAIL', 'MAIL']);
  const telIdx    = matchHeader(['TELEFONE', 'TEL', 'FONE', 'PHONE', 'CELULAR', 'CEL', 'WHATSAPP']);
  const cepIdx    = matchHeader(['CEP', 'ZIP', 'POSTAL']);
  const logIdx    = matchHeader(['LOGRADOURO', 'ENDERECO', 'ENDEREÇO', 'RUA', 'AVENIDA', 'AV']);
  const numIdx    = matchHeader(['NUMERO', 'NÚMERO', 'NRO', 'NUMBER', 'NUM']);
  const compIdx   = matchHeader(['COMPLEMENTO', 'COMPL', 'COMP']);
  const bairroIdx = matchHeader(['BAIRRO', 'DISTRITO']);
  const cidadeIdx = matchHeader(['CIDADE', 'MUNICIPIO', 'MUNICÍPIO', 'CITY']);
  const ufIdx     = matchHeader(['UF', 'ESTADO', 'STATE']);
  if (docIdx === -1 && nomeIdx === -1) throw new Error('Colunas "DOC" ou "NOME" não encontradas');
  let imported = 0, updated = 0;
  const docMap = {}, nameMap = {};
  state.clients.forEach(c => {
    if (c.doc) docMap[c.doc.replace(/\D/g, '')] = c;
    if (c.nome) nameMap[c.nome.toUpperCase().trim()] = c;
  });
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCSVLine(lines[i], delim);
    if (!cols.some(c => c.trim())) continue;
    const doc = docIdx >= 0 ? cols[docIdx].replace(/^"|"$/g, '').trim() : '';
    const docClean = doc.replace(/\D/g, '');
    const nome = nomeIdx >= 0 ? cols[nomeIdx].replace(/^"|"$/g, '').trim() : '';
    if (!docClean && !nome) continue;
    const up = v => v.toUpperCase();
    const data = {
      doc,
      nome: up(nome),
      fantasia: fantasiaIdx >= 0 ? up(cols[fantasiaIdx].replace(/^"|"$/g, '').trim()) : up(nome),
      email: up(emailIdx >= 0 ? cols[emailIdx].replace(/^"|"$/g, '').trim() : ''),
      telefone: up(telIdx >= 0 ? cols[telIdx].replace(/^"|"$/g, '').trim() : ''),
      cep: cepIdx >= 0 ? cols[cepIdx].replace(/^"|"$/g, '').trim() : '',
      logradouro: up(logIdx >= 0 ? cols[logIdx].replace(/^"|"$/g, '').trim() : ''),
      numero: up(numIdx >= 0 ? cols[numIdx].replace(/^"|"$/g, '').trim() : ''),
      complemento: up(compIdx >= 0 ? cols[compIdx].replace(/^"|"$/g, '').trim() : ''),
      bairro: up(bairroIdx >= 0 ? cols[bairroIdx].replace(/^"|"$/g, '').trim() : ''),
      cidade: up(cidadeIdx >= 0 ? cols[cidadeIdx].replace(/^"|"$/g, '').trim() : ''),
      uf: up(ufIdx >= 0 ? cols[ufIdx].replace(/^"|"$/g, '').trim() : ''),
    };
    if (docClean && docMap[docClean]) {
      Object.assign(docMap[docClean], data);
      updated++;
    } else if (!docClean && nameMap[up(nome).trim()]) {
      Object.assign(nameMap[up(nome).trim()], data);
      updated++;
    } else {
      const newClient = { id: uid(), ...data };
      state.clients.push(newClient);
      if (docClean) docMap[docClean] = newClient;
      if (nome) nameMap[up(nome).trim()] = newClient;
      imported++;
    }
  }
  return { imported, updated };
}

function parseProductsJSON(arr) {
  if (!arr || !arr.length) throw new Error('Nenhum produto encontrado');
  var keys = Object.keys(arr[0]);
  var k = function(aliases) {
    for (var i = 0; i < keys.length; i++) {
      var kUp = keys[i].toUpperCase().replace(/[^A-Z0-9]/g, '');
      for (var j = 0; j < aliases.length; j++) {
        if (kUp === aliases[j].toUpperCase().replace(/[^A-Z0-9]/g, '')) return keys[i];
      }
    }
    return null;
  };
  var nomeKey = k(['PRODUTO', 'NOME', 'DESCRICAO', 'DESCRIÇÃO', 'ITEM']);
  var tipoKey = k(['TIPO', 'TP']);
  var grupoKey = k(['GRUPO', 'CATEGORIA', 'DEPARTAMENTO', 'SECAO', 'SEÇÃO']);
  var subKey = k(['SUB-GRUPO', 'SUBGRUPO', 'SUB', 'SUB_GRUPO', 'SUBGRUP']);
  var precoKey = k(['PRECO', 'PREÇO', 'PRECO_BASE', 'PREÇO_BASE', 'VALOR']);
  if (!nomeKey) throw new Error('Coluna "PRODUTO" nao encontrada');
  var up = function(v) { return String(v !== undefined && v !== null ? v : '').toUpperCase(); };
  // Preserva IDs existentes pelo nome (igual ao parseCSVProductText)
  var nameMap = {};
  state.products.forEach(function(p) { nameMap[p.nome.toUpperCase().trim()] = p; });
  var imported = 0, updated = 0;
  for (var i = 0; i < arr.length; i++) {
    var item = arr[i];
    var nome = up(item[nomeKey]);
    if (!nome || nome.startsWith('PRODUTO')) continue;
    var precoStr = String(precoKey ? item[precoKey] : '0').replace(',', '.').replace(/[^0-9.eE\-+]/g, '');
    var data = {
      nome: nome,
      tipo: tipoKey ? up(item[tipoKey]) : '',
      grupo: grupoKey ? up(item[grupoKey]) : '',
      sub_grupo: subKey ? up(item[subKey]) : '',
      preco_base: parseFloat(precoStr) || 0
    };
    if (nameMap[nome.trim()]) {
      // Produto já existe: atualiza sem mudar o ID (preserva assigned e prices)
      Object.assign(nameMap[nome.trim()], data);
      updated++;
    } else {
      state.products.push({ id: uid(), ...data });
      imported++;
    }
  }
  return { imported: imported, updated: updated };
}

function fetchFromAppsScript(type) {
  return new Promise(function(resolve, reject) {
    var url = getScriptUrl();
    if (!url) { reject(new Error('Apps Script nao configurado')); return; }
    var cb = 'ascb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
    var t = setTimeout(function() { delete window[cb]; reject(new Error('Timeout')); }, 15000);
    window[cb] = function(data) { clearTimeout(t); delete window[cb]; resolve(data); };
    var s = document.createElement('script');
    s.src = url + '?type=' + type + '&callback=' + cb;
    s.onerror = function() { clearTimeout(t); delete window[cb]; reject(new Error('Erro de rede')); };
    document.body.appendChild(s);
  });
}

async function syncProducts() {
  if (getScriptUrl()) {
    try {
      var json = await fetchFromAppsScript('products');
      if (json.success) {
        return parseProductsJSON(json.data);
      }
      throw new Error(json.error || 'Erro desconhecido');
    } catch (e) {
      console.warn('Apps Script falhou, tentando CSV:', e.message);
    }
  }
  var text = await fetchCSV(PRODUCTS_CSV_URL);
  return parseCSVProductText(text);
}

async function syncClients() {
  if (getScriptUrl()) {
    try {
      var json = await fetchFromAppsScript('clients');
      if (json.success) {
        return parseClientsJSON(json.data);
      }
      throw new Error(json.error || 'Erro desconhecido');
    } catch (e) {

function updateSyncStatus(type, msg) {
  var dot = document.getElementById('syncDot');
  var label = document.getElementById('syncLabel');
  if (!dot || !label) return;
  if (type === 'syncing') {
    dot.className = 'dot orange pulse';
    label.textContent = msg || 'Sincronizando...';
  } else if (type === 'success') {
    dot.className = 'dot green';
    label.textContent = msg || 'Sincronizado';
    var ts = Date.now();
    try { localStorage.setItem('lastSyncTime', ts); } catch(e) {}
  } else if (type === 'offline') {
    dot.className = 'dot gray';
    label.textContent = msg || 'Offline';
  } else if (type === 'nodata') {
    dot.className = 'dot orange';
    label.textContent = msg || 'Sem dados';
  }
}

async function syncAll() {
  updateSyncStatus('syncing');
  // Preserva assigned e prices ANTES do sync para garantir que nunca sejam perdidos
  var assignedBackup = JSON.parse(JSON.stringify(state.assigned));
  var pricesBackup = JSON.parse(JSON.stringify(state.prices));
  var resultP, resultC, errorMsg = '';
  try { resultP = await syncProducts(); } catch (e) { errorMsg = e.message; }
  try { resultC = await syncClients(); } catch (e) { errorMsg = (errorMsg ? errorMsg + ' | ' : '') + e.message; }
  // Restaura assigned e prices caso o sync tenha apagado (nunca devem ser perdidos pelo sync)
  Object.keys(assignedBackup).forEach(function(k) { if (!state.assigned[k]) state.assigned[k] = assignedBackup[k]; });
  Object.keys(pricesBackup).forEach(function(k) { if (state.prices[k] === undefined) state.prices[k] = pricesBackup[k]; });
  var hasData = (state.products.length > 0 || state.clients.length > 0);
  if (resultP || resultC) {
    saveState();
    var msgs = [];
    if (resultP && resultP.imported + resultP.updated > 0) msgs.push(resultP.imported + ' produtos adicionados, ' + resultP.updated + ' atualizados');
    if (resultC && resultC.imported + resultC.updated > 0) msgs.push(resultC.imported + ' clientes adicionados, ' + resultC.updated + ' atualizados');
    if (msgs.length) toast(msgs.join(' | '));
  }
  if (!errorMsg) {
    var count = (resultP ? resultP.imported + resultP.updated : 0) + (resultC ? resultC.imported + resultC.updated : 0);
    if (count > 0) {
      updateSyncStatus('success', 'Sincronizado agora');
    } else if (hasData) {
      updateSyncStatus('success', 'Dados carregados');
    } else {
      updateSyncStatus('nodata', 'Nenhum dado');
    }
  } else {
    if (hasData) {
      updateSyncStatus('offline', 'Dados locais');
      console.warn('Sync offline:', errorMsg);
    } else {
      updateSyncStatus('nodata', 'Sem conexão');
      console.warn('Sync falhou, sem dados locais:', errorMsg);
    }
  }
  render();
}

function salvarScriptUrl() {
  var url = document.getElementById('f_scriptUrl').value.trim();
  setScriptUrl(url);
  updateSheetStatus();
  closeModal();
  if (url) toast('URL da planilha salva!');
  else toast('URL removida.', 'info');
}

async function testarConexao() {
  var url = document.getElementById('f_scriptUrl').value.trim();
  var el = document.getElementById('testResult');
  if (!url) { el.innerHTML = '<span style="color:var(--danger);">&#10008; Insira a URL primeiro.</span>'; return; }
  el.innerHTML = '<span style="color:var(--gray-400);">&#8987; Testando...</span>';
  try {
    var ctrl = new AbortController();
    var tid = setTimeout(function() { ctrl.abort(); }, 10000);
    var res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ type: 'product', data: { nome: '__test__' }, action: 'create' }), signal: ctrl.signal });
    clearTimeout(tid);
    if (res.ok) {
      el.innerHTML = '<span style="color:var(--success);">&#9989; Conexão OK! Servidor respondeu.</span>';
    } else {
      var txt = await res.text().catch(function() { return 'sem resposta'; });
      el.innerHTML = '<span style="color:var(--warning);">&#9888; Servidor respondeu com status ' + res.status + '. Verifique se o Web App está publicado como "Qualquer pessoa".</span>';
    }
  } catch (e) {
    el.innerHTML = '<span style="color:var(--danger);">&#10008; Erro: ' + e.message + '. Verifique a URL e se o Web App está publicado.</span>';
  }
}

function sendToSheet(type, data, action) {
  var url = getScriptUrl();
  if (!url) { console.warn('sendToSheet: sem URL configurada'); return; }
  console.log('Enviando para planilha:', type, url);
  try {
    var body = JSON.stringify({ type: type, data: data, action: action || 'create' });
    if (navigator.sendBeacon) {
      navigator.sendBeacon(url, body);
    } else {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', url, true);
      xhr.setRequestHeader('Content-Type', 'text/plain');
      xhr.send(body);
    }
  } catch (e) {
    console.warn('Sheet: ' + e.message);
  }
}

async function uploadToSheet() {
  var url = getScriptUrl();
  if (!url) { toast('Configure a planilha primeiro (engrenagem na sidebar).', 'info'); return; }
  toast('Enviando dados para planilha...', 'info');
  var produtos = getActiveProducts().map(function(p) { return { nome: p.nome, tipo: p.tipo, grupo: p.grupo, sub_grupo: p.sub_grupo, preco_base: p.preco_base }; });
  var clientes = getActiveClients().map(function(c) { return { nome: c.nome, fantasia: c.fantasia, doc: c.doc, email: c.email, telefone: c.telefone, cep: c.cep, logradouro: c.logradouro, numero: c.numero, complemento: c.complemento, bairro: c.bairro, cidade: c.cidade, uf: c.uf }; });
  try {
    var res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ type: 'syncAll', products: produtos, clients: clientes }) });
    try {
      var json = await res.json();
      if (json.success) {
        toast(produtos.length + ' produtos e ' + clientes.length + ' clientes enviados!', 'success');
      } else {
        toast('Erro na planilha: ' + (json.error || 'resposta invalida'), 'error');
      }
    } catch (e2) {
      toast('Dados enviados (resposta inesperada)', 'info');
    }
  } catch (e) {
    toast('Erro ao enviar: ' + e.message, 'error');
  }
}

async function consultarCNPJ() {
  const docInput = document.getElementById('f_doc');
  const doc = cleanCPF_CNPJ(docInput.value);
  if (doc.length !== 14) { toast('CNPJ deve ter 14 dígitos', 'error'); return; }
  const btn = document.getElementById('btnConsultar');
  btn.disabled = true; btn.innerHTML = '&#8987; Consultando...';

  const apis = [
    {
      url: `https://brasilapi.com.br/api/cnpj/v1/${doc}`,
      parse: (data) => ({
        nome: data.razao_social || '',
        fantasia: data.nome_fantasia || '',
        email: data.email || '',
        telefone: data.ddd_telefone_1 || '',
        cep: data.cep || '',
        logradouro: data.logradouro || '',
        numero: data.numero || '',
        complemento: data.complemento || '',
        bairro: data.bairro || '',
        cidade: data.municipio || '',
        uf: data.uf || '',
      })
    },
    {
      url: `https://minhareceita.org/${doc}`,
      parse: (data) => ({
        nome: data.razao_social || data.nome || '',
        fantasia: data.nome_fantasia || '',
        email: data.email || '',
        telefone: data.telefone || '',
        cep: data.cep || '',
        logradouro: data.logradouro || '',
        numero: data.numero || '',
        complemento: data.complemento || '',
        bairro: data.bairro || '',
        cidade: data.municipio || '',
        uf: data.uf || '',
      })
    }
  ];

  let lastError = '';
  for (const api of apis) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);
      const res = await fetch(api.url, { signal: controller.signal });
      clearTimeout(timeoutId);
      if (!res.ok) { lastError = 'HTTP ' + res.status; continue; }
      const data = await res.json();
      if (data.message && data.message.includes('não encontrado')) { lastError = 'CNPJ não encontrado'; continue; }
      const parsed = api.parse(data);
      document.getElementById('f_nome').value = parsed.nome;
      document.getElementById('f_fantasia').value = parsed.fantasia;
      document.getElementById('f_email').value = parsed.email;
      document.getElementById('f_telefone').value = parsed.telefone;
      document.getElementById('f_cep').value = parsed.cep;
      document.getElementById('f_logradouro').value = parsed.logradouro;
      document.getElementById('f_numero').value = parsed.numero;
      document.getElementById('f_complemento').value = parsed.complemento;
      document.getElementById('f_bairro').value = parsed.bairro;
      document.getElementById('f_cidade').value = parsed.cidade;
      document.getElementById('f_uf').value = parsed.uf;
      toast('Dados do CNPJ carregados via ' + api.url.split('/')[2]);
      btn.disabled = false; btn.innerHTML = '&#128269; Consultar CNPJ';
      return;
    } catch (e) {
      lastError = e.name === 'AbortError' ? 'Tempo limite excedido' : e.message;
      continue;
    }
  }
  toast('Erro ao consultar CNPJ: ' + lastError, 'error');
  btn.disabled = false; btn.innerHTML = '&#128269; Consultar CNPJ';
}

let _lastCepSearch = '';
function autoBuscarCEP(input) {
  const raw = input.value.replace(/\D/g, '');
  if (raw.length > 5) input.value = raw.slice(0, 5) + '-' + raw.slice(5);
  else input.value = raw;
  if (raw.length === 8 && raw !== _lastCepSearch) { _lastCepSearch = raw; consultarCEP(raw); }
}

async function consultarCEP(cep) {
  const apis = [
    { url: `https://viacep.com.br/ws/${cep}/json/`, parse: d => d.erro ? null : { logradouro: d.logradouro || '', bairro: d.bairro || '', cidade: d.localidade || '', uf: d.uf || '' } },
    { url: `https://brasilapi.com.br/api/cep/v2/${cep}`, parse: d => d.errors ? null : { logradouro: d.street || '', bairro: d.neighborhood || '', cidade: d.city || '', uf: d.state || '' } },
  ];
  for (const api of apis) {
    try {
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 5000);
      const res = await fetch(api.url, { signal: ctrl.signal });
      clearTimeout(tid);
      if (!res.ok) continue;
      const data = await res.json();
      const parsed = api.parse(data);
      if (!parsed) continue;
      document.getElementById('f_logradouro').value = parsed.logradouro;
      document.getElementById('f_bairro').value = parsed.bairro;
      document.getElementById('f_cidade').value = parsed.cidade;
      document.getElementById('f_uf').value = parsed.uf;
      return;
    } catch (_) {}
  }
}

function saveClient(e, id) {
  e.preventDefault();
  const doc = cleanCPF_CNPJ(document.getElementById('f_doc').value);
  const data = {
    doc,
    nome: document.getElementById('f_nome').value.trim(),
    fantasia: document.getElementById('f_fantasia').value.trim(),
    email: document.getElementById('f_email').value.trim(),
    telefone: document.getElementById('f_telefone').value.trim(),
    cep: document.getElementById('f_cep').value.trim(),
    logradouro: document.getElementById('f_logradouro').value.trim(),
    numero: document.getElementById('f_numero').value.trim(),
    complemento: document.getElementById('f_complemento').value.trim(),
    bairro: document.getElementById('f_bairro').value.trim(),
    cidade: document.getElementById('f_cidade').value.trim(),
    uf: document.getElementById('f_uf').value.trim(),
  };
  if (!data.nome) { toast('Informe o nome/razão social', 'error'); return; }

  if (id) {
    const idx = state.clients.findIndex(c => c.id === id);
    if (idx >= 0) { state.clients[idx] = { ...state.clients[idx], ...data }; }
    toast('Cliente atualizado!');
  } else {
    if (state.clients.some(c => c.doc === doc && doc)) { toast('Já existe cliente com este documento', 'error'); return; }
    const newClient = { id: uid(), ...data };
    state.clients.push(newClient);
    toast('Cliente cadastrado!');
    sendToSheet('client', data);
  }
  saveState(); updateSyncStatus('success', 'Dados salvos'); closeModal(); render();
}

function showConfirmModal(message, onConfirm) {
  var overlay = document.getElementById('modalOverlay');
  var content = document.getElementById('modalContent');
  content.className = 'modal';
  content.innerHTML =
    '<div class="modal-header">' +
      '<h3>&#9888; Confirmar Exclusão</h3>' +
      '<button class="modal-close" onclick="closeModal()">&times;</button>' +
    '</div>' +
    '<div class="modal-body">' +
      '<p style="font-size:14px;color:var(--gray-700);">' + message + '</p>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
      '<button type="button" class="btn btn-danger" id="btnConfirmDelete">Excluir</button>' +
    '</div>';
  overlay.classList.add('open');
  document.getElementById('btnConfirmDelete').onclick = function() {
    closeModal();
    onConfirm();
  };
}

function deleteClient(id) {
  showConfirmModal('Tem certeza que deseja excluir este cliente? Todos os pre&ccedil;os personalizados deste cliente tamb&eacute;m ser&atilde;o removidos.', function() {
    state.clients.forEach(function(c) { if (c.id === id) c._deleted = true; });
    Object.keys(state.prices).forEach(function(k) { if (k.startsWith(id + '_')) delete state.prices[k]; });
    saveState(); updateSyncStatus('success', 'Dados salvos'); render();
    toast('Cliente exclu&iacute;do');
    uploadToSheet();
  });
}

  if (letra) filtered = filtered.filter(p => (p.nome || '').toUpperCase().startsWith(letra));

    <div class="card">
