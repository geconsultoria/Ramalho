        <span style="font-size:13px;color:var(--gray-500);margin-left:auto;">${total} produto${total !== 1 ? 's' : ''}</span>
      </div>

function saveProduct(e, id) {
  e.preventDefault();
  let grupo = document.getElementById('p_grupo').value;
  if (grupo === '__new__') {
    grupo = prompt('Digite o nome do novo grupo:');
    if (!grupo || !grupo.trim()) { toast('Informe o nome do grupo', 'error'); return; }
    grupo = grupo.trim();
  }
  const data = {
    nome: document.getElementById('p_nome').value.trim(),
    tipo: document.getElementById('p_tipo').value.trim(),
    grupo: grupo,
    sub_grupo: document.getElementById('p_sub_grupo').value.trim(),
    preco_base: parseFloat(document.getElementById('p_preco').value) || 0,
  };
  if (!data.nome) { toast('Informe o nome do produto', 'error'); return; }

  if (id) {
    const idx = state.products.findIndex(p => p.id === id);
    if (idx >= 0) state.products[idx] = { ...state.products[idx], ...data };
    toast('Produto atualizado!');
  } else {
    state.products.push({ id: uid(), ...data });
    toast('Produto cadastrado!');
    sendToSheet('product', data);
  }
  saveState(); updateSyncStatus('success', 'Dados salvos'); closeModal(); render();
}

function deleteProduct(id) {
  showConfirmModal('Tem certeza que deseja excluir este produto? Todos os pre&ccedil;os personalizados deste produto tamb&eacute;m ser&atilde;o removidos.', function() {
    state.products.forEach(function(p) { if (p.id === id) p._deleted = true; });
    Object.keys(state.prices).forEach(function(k) { if (k.endsWith('_' + id)) delete state.prices[k]; });
    saveState(); updateSyncStatus('success', 'Dados salvos'); render();
    toast('Produto exclu&iacute;do');
    uploadToSheet();
  });
}

function renderClientList() {
  var activeClients = getActiveClients();
  var sorted = activeClients.slice().sort(function(a, b) {
    return (a.nome || '').localeCompare(b.nome || '');
  });

  var letters = [];
  sorted.forEach(function(c) {
    var l = (c.nome || '?')[0].toUpperCase();
    if (letters.indexOf(l) === -1) letters.push(l);
  });
  letters.sort();

  var filtered = state.priceLetterFilter
    ? sorted.filter(function(c) { return (c.nome || '?')[0].toUpperCase() === state.priceLetterFilter; })
    : sorted;

  var html = '';
  html += '<div class="card">';
  html += '<div class="card-header">';
  html += '<h3>&#128101; Selecione o Cliente</h3>';
  html += '<span style="font-size:13px;color:var(--gray-500);">' + activeClients.length + ' cliente' + (activeClients.length !== 1 ? 's' : '') + '</span>';
  html += '</div>';
  html += '<div class="card-body">';

  if (activeClients.length === 0) {
    html += '<div class="empty-state" style="padding:20px;"><p>' + (state.clients.length > 0 ? 'Todos os clientes foram exclu&iacute;dos.' : 'Cadastre clientes na aba "Clientes" para come&ccedil;ar.') + '</p></div>';
  } else {
    // Alphabet navigation bar
    html += '<div style="display:flex;gap:3px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--gray-200);">';
    html += '<button class="btn btn-sm ' + (!state.priceLetterFilter ? 'btn-primary' : 'btn-ghost') + '" onclick="state.priceLetterFilter=\'\';render()" style="min-width:30px;padding:3px 7px;font-size:12px;font-weight:600;">#</button>';
    for (var i = 0; i < letters.length; i++) {
      var l = letters[i];
      var active = state.priceLetterFilter === l;
      html += '<button class="btn btn-sm ' + (active ? 'btn-primary' : 'btn-ghost') + '" onclick="state.priceLetterFilter=\'' + l + '\';render()" style="min-width:30px;padding:3px 7px;font-size:12px;font-weight:600;">' + l + '</button>';
    }
    html += '</div>';

    // Client table (lista em linhas igual à tela de clientes)
    html += '<div class="table-wrap">';
    if (filtered.length === 0) {
      html += '<div class="empty-state" style="padding:20px;"><p>Nenhum cliente com essa letra</p></div>';
    } else {
      html += '<table>';
      html += '<thead><tr><th>Nome / Razão Social</th><th>Documento</th><th>Cidade</th><th style="text-align:right;">Ação</th></tr></thead>';
      html += '<tbody>';
      for (var i = 0; i < filtered.length; i++) {
        var c = filtered[i];
        html += '<tr style="cursor:pointer;" onclick="selectClient(\'' + c.id + '\')">';
        html += '<td><div style="display:flex;align-items:center;gap:10px;">';
        html += '<div style="width:34px;height:34px;border-radius:50%;background:var(--primary-bg);color:var(--primary);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">' + (c.nome || '?')[0].toUpperCase() + '</div>';
        html += '<div><strong>' + (c.nome || 'Sem nome') + '</strong>' + (c.fantasia && c.fantasia !== c.nome ? '<br><span style="font-size:12px;color:var(--gray-400);">' + c.fantasia + '</span>' : '') + '</div>';
        html += '</div></td>';
        html += '<td style="font-family:monospace;font-size:11px;white-space:nowrap;">' + maskCNPJ(c.doc || '') + '</td>';
        html += '<td style="font-size:13px;color:var(--gray-500);">' + [c.cidade, c.uf].filter(Boolean).join(' - ') + '</td>';
        html += '<td style="text-align:right;"><button class="btn btn-sm btn-primary" onclick="event.stopPropagation();selectClient(\'' + c.id + '\')" style="font-size:12px;padding:5px 12px;">&#36; Ver Preços</button></td>';
        html += '</tr>';
      }
      html += '</tbody></table>';
    }
    html += '</div>';
  }

  html += '</div></div>';

  if (!state.selectedClient) {
    html += '<div class="empty-state" style="margin-top:20px;"><div class="icon">&#128071;</div><h4>Selecione um cliente</h4><p>Escolha um cliente acima para ver e editar a tabela de pre&ccedil;os.</p></div>';
  }

  return html;
}

function renderPrices(container, actions) {
  const printBtn = getActiveClients().length === 0 ? '' : '<button class="btn btn-outline" onclick="openPrintClientPicker()">&#128424; Imprimir</button>';
  if (state.selectedClient) {
    actions.innerHTML =
      printBtn +
      (getActiveClients().length === 0 ? '' : ' <button class="btn btn-success" onclick="exportPrices()">&#128230; Exportar</button>');
    container.innerHTML = renderPriceTable();
  } else {
    actions.innerHTML = printBtn;
    container.innerHTML = renderClientList();
  }
}

function getClientAssignedProducts(clientId) {
  return state.assigned[clientId];
}

function selectClient(id) {
  state.selectedClient = id;
  const assigned = getClientAssignedProducts(id);
  if (assigned === undefined) {
    const customKeys = Object.keys(state.prices).filter(k => k.startsWith(id + '_'));
    if (customKeys.length > 0) {
      state.assigned[id] = customKeys.map(k => k.slice(id.length + 1));
      saveState();
    } else {
      showProductPicker(id);
      return;
    }
  }
  render();
}

function showProductPicker(clientId) {
  var activeProducts = getActiveProducts();
  const client = state.clients.find(c => c.id === clientId);
  const grupos = [...new Set(activeProducts.map(p => p.grupo).filter(Boolean))].sort();
  const assigned = getClientAssignedProducts(clientId) || [];
  const groupOptions = grupos.map(g => '<option value="' + escapeHtml(g) + '">' + escapeHtml(g) + '</option>').join('');
  const productItems = [...activeProducts].sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR', {sensitivity:'base'})).map(p => {
    const checked = assigned.includes(p.id) ? 'checked' : '';
    return '<label class="picker-item" data-grupo="' + (p.grupo || '').toUpperCase() + '" data-nome="' + (p.nome || '').toUpperCase() + '" style="display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--gray-100);transition:background 0.15s;">' +
      '<input type="checkbox" class="prod-check" value="' + p.id + '" ' + checked + ' style="width:16px;height:16px;accent-color:var(--primary);">' +
      '<span style="flex:1;font-size:13px;"><strong>' + truncate(p.nome, 55) + '</strong> <span style="color:var(--gray-400);font-size:11px;margin-left:6px;">' + (p.grupo || '') + '</span></span>' +
      '</label>';
  }).join('');
  openModal(`
    <div class="modal-header">
      <h3 style="font-size:15px;">Selecionar Produtos — ${client?.nome || 'Cliente'}</h3>
    </div>
    <div class="modal-body">
      <div style="margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <input type="text" id="pickerSearch" placeholder="Buscar produto..." oninput="filterPicker()" style="flex:1;min-width:140px;padding:7px 12px;border:1px solid var(--gray-300);border-radius:var(--radius-xs);font-size:13px;">
        <select id="pickerGrupoFilter" onchange="filterPicker()" style="padding:7px 10px;border:1px solid var(--gray-300);border-radius:var(--radius-xs);font-size:13px;background:white;min-width:130px;">
          <option value="">Todos grupos</option>
          ${groupOptions}
        </select>
        <button type="button" class="btn btn-sm btn-ghost" onclick="closeModal();state.selectedClient=null;render()" style="font-size:11px;padding:5px 14px;white-space:nowrap;">Cancelar</button>
        <button type="button" class="btn btn-sm btn-primary" onclick="saveProductSelection('${clientId}')" style="font-size:11px;padding:5px 14px;white-space:nowrap;">&#10003; Salvar</button>
      </div>
      <div style="margin-bottom:8px;display:flex;gap:6px;align-items:center;">
        <button type="button" class="btn btn-sm btn-ghost" onclick="document.querySelectorAll('.prod-check').forEach(c=>c.checked=true)" style="font-size:11px;padding:4px 10px;white-space:nowrap;">&#9745; Marcar todos</button>
        <button type="button" class="btn btn-sm btn-ghost" onclick="document.querySelectorAll('.prod-check').forEach(c=>c.checked=false)" style="font-size:11px;padding:4px 10px;white-space:nowrap;">&#9744; Desmarcar todos</button>
      </div>
      <div id="pickerList" style="max-height:420px;overflow-y:auto;border:1px solid var(--gray-200);border-radius:var(--radius-sm);background:white;">
        ${productItems}
      </div>
    </div>
  `, true, true);
}

function saveProductSelection(clientId) {
  const checked = document.querySelectorAll('.prod-check:checked');
  const ids = Array.from(checked).map(cb => cb.value);
  if (ids.length === 0) {
    // Permite remover todos os produtos do cliente
    confirmDialog('Remover todos os produtos?', 'Nenhum produto está selecionado. Deseja remover <strong>todos</strong> os produtos deste cliente?', function() {
      delete state.assigned[clientId];
      saveState();
      closeModal();
      state.selectedClient = null;
      toast('Todos os produtos foram removidos do cliente.');
      render();
    });
    return;
  }
  state.assigned[clientId] = ids;
  saveState();
  closeModal();
  toast('Produtos selecionados com sucesso!');
  render();
}

function showCopyClientModal(sourceClientId) {
  const source = state.clients.find(c => c.id === sourceClientId);
  const assignedIds = getClientAssignedProducts(sourceClientId) || [];
  if (assignedIds.length === 0) { toast('Este cliente não possui produtos para copiar', 'error'); return; }

  const others = getActiveClients().filter(c => c.id !== sourceClientId)
    .sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR', {sensitivity:'base'}));

  if (others.length === 0) { toast('Não há outro cliente cadastrado', 'error'); return; }

  const itemsHtml = others.map(c => {
    return '<label class="copy-client-item" data-nome="' + (c.nome || '').toUpperCase() + '" style="display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--gray-100);">' +
      '<input type="radio" name="copyTargetClient" value="' + c.id + '" style="width:16px;height:16px;accent-color:var(--primary);">' +
      '<div style="width:30px;height:30px;border-radius:50%;background:var(--primary-bg);color:var(--primary);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">' + (c.nome || '?')[0].toUpperCase() + '</div>' +
      '<span style="flex:1;font-size:13px;"><strong>' + (c.nome || 'Sem nome') + '</strong>' + (c.fantasia && c.fantasia !== c.nome ? ' <span style="color:var(--gray-400);font-size:11px;">(' + c.fantasia + ')</span>' : '') + '</span>' +
      '</label>';
  }).join('');

  openModal(`
    <div class="modal-header">
      <h3 style="font-size:15px;">Copiar produtos de — ${source?.nome || 'Cliente'}</h3>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--gray-500);margin-bottom:10px;">${assignedIds.length} produto${assignedIds.length !== 1 ? 's' : ''} ser${assignedIds.length !== 1 ? 'ão' : 'á'} copiado${assignedIds.length !== 1 ? 's' : ''} para o cliente selecionado abaixo.</p>
      <input type="text" id="copyClientSearch" placeholder="Buscar cliente..." oninput="filterCopyClientList()" style="width:100%;padding:7px 12px;border:1px solid var(--gray-300);border-radius:var(--radius-xs);font-size:13px;margin-bottom:10px;">
      <div id="copyClientList" style="max-height:300px;overflow-y:auto;border:1px solid var(--gray-200);border-radius:var(--radius-sm);background:white;margin-bottom:14px;">
        ${itemsHtml}
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:14px;cursor:pointer;">
        <input type="checkbox" id="copyIncludePrices" checked style="width:16px;height:16px;accent-color:var(--primary);">
        Copiar também os preços personalizados deste cliente
      </label>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button type="button" class="btn btn-sm btn-ghost" onclick="closeModal()" style="font-size:11px;padding:5px 14px;">Cancelar</button>
        <button type="button" class="btn btn-sm btn-primary" onclick="copyProductsToClient('${sourceClientId}')" style="font-size:11px;padding:5px 14px;">&#10003; Copiar</button>
      </div>
    </div>
  `, true, true);
}

function filterCopyClientList() {
  const q = document.getElementById('copyClientSearch').value.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  document.querySelectorAll('.copy-client-item').forEach(el => {
    const nome = (el.getAttribute('data-nome') || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    el.style.display = nome.includes(q) ? 'flex' : 'none';
  });
}

function copyProductsToClient(sourceClientId) {
  const selected = document.querySelector('input[name="copyTargetClient"]:checked');
  if (!selected) { toast('Selecione o cliente de destino', 'error'); return; }
  const targetClientId = selected.value;
  const includePrices = document.getElementById('copyIncludePrices').checked;
  const targetClient = state.clients.find(c => c.id === targetClientId);

  const sourceIds = getClientAssignedProducts(sourceClientId) || [];
  if (sourceIds.length === 0) { toast('Nenhum produto para copiar', 'error'); return; }

  const existingIds = getClientAssignedProducts(targetClientId) || [];
  const mergedIds = Array.from(new Set([...existingIds, ...sourceIds]));

  confirmDialog('Copiar produtos?', 'Os ' + sourceIds.length + ' produtos selecionados serão adicionados ao cliente <strong>' + (targetClient?.nome || '') + '</strong>' + (includePrices ? ', incluindo os preços personalizados' : '') + '. Produtos já existentes no destino não serão duplicados.', function() {
    state.assigned[targetClientId] = mergedIds;

    if (includePrices) {
      sourceIds.forEach(function(productId) {
        const price = state.prices[sourceClientId + '_' + productId];
        if (price !== undefined) {
          state.prices[targetClientId + '_' + productId] = price;
        }
      });
    }

    saveState();
    closeModal();
    toast('Produtos copiados para "' + (targetClient?.nome || 'cliente') + '" com sucesso!');
    uploadToSheet();
    render();
  });
}

function removeProductFromClient(clientId, productId) {
  confirmDialog('Remover produto?', 'Deseja remover este produto da tabela de preços deste cliente?', function() {
    var ids = state.assigned[clientId] || [];
    ids = ids.filter(function(id) { return id !== productId; });
    delete state.prices[clientId + '_' + productId];
    if (ids.length === 0) {
      delete state.assigned[clientId];
    } else {
      state.assigned[clientId] = ids;
    }
    saveState();
    state.selectedClient = clientId;
    toast('Produto removido da seleção.');
    render();
  });
}

function filterPicker() {
  const q = document.getElementById('pickerSearch').value.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const g = document.getElementById('pickerGrupoFilter').value.toUpperCase();
  document.querySelectorAll('.picker-item').forEach(el => {
    const nome = (el.dataset.nome || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const matchNome = !q || nome.includes(q);
    const matchGrupo = !g || el.dataset.grupo === g;
    el.style.display = matchNome && matchGrupo ? 'flex' : 'none';
  });
}

function renderPriceTable() {
  const client = state.clients.find(c => c.id === state.selectedClient);
  if (!client) return '<div class="empty-state"><h4>Cliente não encontrado</h4></div>';

  var activeProducts = getActiveProducts();
  const assignedIds = getClientAssignedProducts(state.selectedClient);
  const grupo = state.productFilter.grupo;
  let filtered = assignedIds ? activeProducts.filter(p => assignedIds.includes(p.id)) : activeProducts;
  if (grupo) filtered = filtered.filter(p => p.grupo === grupo);
  filtered = [...filtered].sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR', {sensitivity:'base'}));

  const grupos = [...new Set(activeProducts.map(p => p.grupo).filter(Boolean))].sort();
  const withCustom = filtered.filter(p => getClientPrice(state.selectedClient, p.id) !== undefined).length;

  const rows = filtered.map(p => {
    const customPrice = getClientPrice(state.selectedClient, p.id);
    const hasCustom = customPrice !== undefined;
    return { ...p, customPrice, hasCustom };
  });

  return `
    <div class="card">
      <div class="card-header" style="flex-wrap:wrap;gap:10px;">
        <div style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;">
          <button class="btn btn-ghost btn-sm" onclick="state.selectedClient=null;state.priceLetterFilter='';render()" style="font-size:12px;padding:4px 10px;flex-shrink:0;">&#8592; Voltar</button>
           <strong style="color:var(--primary);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(client.nome || client.fantasia || 'Cliente')}</strong>
          <button class="btn btn-sm btn-outline" onclick="showProductPicker('${state.selectedClient}')" style="font-size:11px;padding:3px 10px;flex-shrink:0;">Alterar seleção</button>
          <button class="btn btn-sm btn-outline" onclick="showCopyClientModal('${state.selectedClient}')" style="font-size:11px;padding:3px 10px;flex-shrink:0;">&#128203; Copiar para outro cliente</button>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <select style="padding:7px 12px;border:1px solid var(--gray-300);border-radius:var(--radius-xs);font-size:13px;font-family:inherit;background:white;" onchange="state.productFilter.grupo=this.value;render()">
            <option value="">Todos grupos</option>
          ${grupos.map(g => `<option value="${escapeHtml(g)}" ${state.productFilter.grupo === g ? 'selected' : ''}>${escapeHtml(g)}</option>`).join('')}
          </select>
          <span style="font-size:12px;color:var(--gray-400);">${filtered.length} itens | ${withCustom} personalizados</span>
        </div>
      </div>
      <div class="card-body" style="padding:0;">
        ${filtered.length === 0 ? `<div class="empty-state"><h4>Nenhum produto</h4><p>Importe produtos primeiro.</p></div>` : `
        <div class="table-wrap">
          <table class="table-sticky-col">
            <thead>
              <tr><th>Produto</th><th>Tipo</th><th>Grupo</th><th style="text-align:right;">Preço Base</th><th style="text-align:right;">Preço de Venda</th><th style="text-align:right;">Ação</th></tr>
            </thead>
            <tbody>
                ${rows.map(p => {
                const hasCustom = p.hasCustom;
                const displayPrice = hasCustom ? p.customPrice : p.preco_base;
                return `
                <tr>
                   <td><strong>${escapeHtml(truncate(p.nome, 45))}</strong></td>
                  <td><span class="badge badge-info">${p.tipo || '-'}</span></td>
                  <td>${p.grupo || '-'}</td>
                  <td class="price-cell" style="color:var(--gray-400);">${formatMoney(p.preco_base)}</td>
                  <td class="price-cell" style="${hasCustom ? 'color:var(--primary);font-weight:700;' : ''}">
                    ${formatMoney(displayPrice)}
                    ${hasCustom ? '<span style="font-size:10px;color:var(--primary);margin-left:4px;">&#10003;</span>' : ''}
                  </td>
                  <td style="text-align:right;">
                    <div class="price-control" id="pc_${p.id}" style="display:flex;align-items:center;gap:4px;justify-content:flex-end;">
                      <input type="text" inputmode="decimal" id="pval_${p.id}" value="${hasCustom ? p.customPrice : ''}" placeholder="${p.preco_base.toFixed(2)}" style="width:100px;">
                      <button class="save-btn" onclick="saveClientPrice('${state.selectedClient}','${p.id}')">Salvar</button>
                      ${hasCustom ? `<button class="btn-icon delete" onclick="removeClientPrice('${state.selectedClient}','${p.id}')" title="Remover preço personalizado" style="font-size:14px;">&#10005;</button>` : ''}
                      <button class="btn-icon delete" onclick="removeProductFromClient('${state.selectedClient}','${p.id}')" title="Remover produto da seleção" style="font-size:13px;background:#fee2e2;color:#ef4444;border-radius:6px;width:28px;height:28px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;">&#128465;</button>
                    </div>
                  </td>
                </tr>`}).join('')}
            </tbody>
          </table>
        </div>`}
      </div>
    </div>
  `;
}

function saveClientPrice(clientId, productId) {
  var raw = document.getElementById('pval_' + productId).value;
  var val = parseMoney(raw);
  if (!raw || raw.trim() === '' || isNaN(val) || val < 0) { toast('Informe um preço válido (ex: 12,50)', 'error'); return; }
  setClientPrice(clientId, productId, val);
  const product = state.products.find(p => p.id === productId);
  toast('Preço de "' + truncate(product?.nome || '', 30) + '" atualizado!');
  render();
}

function removeClientPrice(clientId, productId) {
  showConfirmModal('Remover pre&ccedil;o personalizado? O pre&ccedil;o base ser&aacute; usado.', function() {
    setClientPrice(clientId, productId, null);
    toast('Pre&ccedil;o personalizado removido');
    render();
  });
}

function exportPrices() {
  if (!state.selectedClient) { toast('Selecione um cliente primeiro', 'error'); return; }
  const client = state.clients.find(c => c.id === state.selectedClient);
  if (!client) return;
  const assignedIds = getClientAssignedProducts(state.selectedClient);
  const prods = assignedIds ? getActiveProducts().filter(p => assignedIds.includes(p.id)) : getActiveProducts();
  let csv = 'Produto;Tipo;Grupo;Sub-Grupo;Preco Base;Preco Venda\n';
  prods.forEach(p => {
    const cp = getClientPrice(state.selectedClient, p.id);
    const price = cp !== undefined ? cp : p.preco_base;
    csv += `"${p.nome}";"${p.tipo || ''}";"${p.grupo || ''}";"${p.sub_grupo || ''}";${(p.preco_base || 0).toFixed(2)};${price.toFixed(2)}\n`;
  });
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `Precos_${(client.nome || client.doc || 'cliente').replace(/\s+/g, '_')}.csv`;
  link.click();
  URL.revokeObjectURL(link.href);
  toast('Tabela exportada com sucesso!');
}

function confirmPrintClient() {

  if (!client) { toast('Cliente não encontrado', 'error'); return; }

  var assignedIds = getClientAssignedProducts(clientId);
  var activeProducts = getActiveProducts();
  var prods = assignedIds ? activeProducts.filter(function(p) { return assignedIds.includes(p.id); }) : activeProducts;
  prods = prods.slice().sort(function(a, b) { return (a.nome || '').localeCompare(b.nome || '', 'pt-BR', {sensitivity:'base'}); });

  if (prods.length === 0) {
    toast('Este cliente não possui produtos na tabela de preços', 'error');
    return;
  }

  var docCliente = maskCNPJ(client.doc || '');
  var cidadeUf = [client.cidade, client.uf].filter(Boolean).join(' - ');
  var agora = new Date();
  var dataFormatada = agora.toLocaleDateString('pt-BR') + ' ' + agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});

  var rowsHtml = prods.map(function(p, i) {

      '<td>' + (p.nome || '') + '</td>' +
      '<td style="text-align:right;font-weight:700;">' + formatMoney(price) + '</td>' +
      '</tr>';
  }).join('');

  var printHtml = '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">' +
    '<title>Tabela de Preços - ' + (client.nome || 'Cliente') + '</title>' +
    '<style>' +
      '*{margin:0;padding:0;box-sizing:border-box;}' +
      'body{font-family:Arial,Helvetica,sans-serif;color:#0f172a;padding:32px;}' +

      'thead th{text-align:left;padding:8px 10px;background:#4f46e5;color:white;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;}' +

    '</style></head><body>' +
    '<div class="header">' +
      '<h1>&#36; Tabela de Preços</h1>' +
      '<div class="meta">Emitido em<br>' + dataFormatada + '</div>' +

function exportState() {
  const data = {
    clients: state.clients,
    products: state.products,
    prices: state.prices,
    assigned: state.assigned,
    fornecedores: state.fornecedores,
    contasAPagar: state.contasAPagar,
    pedidosVenda: state.pedidosVenda
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `backup_${APP_NAME.replace(/\s+/g, '_')}.json`;
  link.click();
  URL.revokeObjectURL(link.href);
  toast('Dados exportados com sucesso!');
}

function importState(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.clients || !data.products) {
        toast('Arquivo inválido: campos clients e products obrigatórios', 'error');
        return;
      }
      state.clients = data.clients;
      migrateClients(state.clients);
      state.products = data.products;
      state.prices = data.prices || {};
      state.assigned = data.assigned || {};
      state.fornecedores = data.fornecedores || [];
      state.contasAPagar = data.contasAPagar || [];
      state.pedidosVenda = data.pedidosVenda || [];
      saveState();
      render();
      toast(`${data.clients.length} clientes, ${data.products.length} produtos, ${(data.fornecedores||[]).length} fornecedores, ${(data.contasAPagar||[]).length} contas e ${(data.pedidosVenda||[]).length} itens de pedidos importados!`);
    } catch (err) {
      toast('Erro ao importar: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function saveFornecedor(e, id) {
  e.preventDefault();
  const doc = cleanCPF_CNPJ(document.getElementById('fo_doc').value);
  const data = {
    doc,
    nome: document.getElementById('fo_nome').value.trim(),
    email: document.getElementById('fo_email').value.trim(),
    telefone: document.getElementById('fo_telefone').value.trim(),
  };
  if (!data.nome) { toast('Informe o nome do fornecedor', 'error'); return; }

  if (id) {
    const idx = state.fornecedores.findIndex(f => f.id === id);
    if (idx >= 0) { state.fornecedores[idx] = { ...state.fornecedores[idx], ...data }; }
    toast('Fornecedor atualizado!');
  } else {
    if (state.fornecedores.some(f => f.doc === doc && doc)) { toast('Já existe fornecedor com este documento', 'error'); return; }
    state.fornecedores.push({ id: uid(), ...data });
    toast('Fornecedor cadastrado!');
  }
  saveState(); updateSyncStatus('success', 'Dados salvos'); closeModal(); render();
}

function deleteFornecedor(id) {
  showConfirmModal('Tem certeza que deseja excluir este fornecedor?', function() {
    state.fornecedores.forEach(function(f) { if (f.id === id) f._deleted = true; });
    saveState(); updateSyncStatus('success', 'Dados salvos'); render();
    toast('Fornecedor excluído');
  });
}

const statusColors = { 'PAGO': 'badge-success', 'PAGO_PARCIALMENTE': 'badge-info', 'A_VENCER': 'badge-info', 'VENCIDO': 'badge-danger', 'CANCELADO': 'badge-secondary' };
const statusLabels = { 'PAGO': 'Pago', 'PAGO_PARCIALMENTE': 'Parcialmente', 'A_VENCER': 'A Vencer', 'VENCIDO': 'Vencido', 'CANCELADO': 'Cancelado' };

// Vincula um fornecedor a todas as contas a pagar cujo título contenha uma

// fornecedor "COMPANHIA FORÇA E LUZ"). Ferramenta reutilizável para

function vfmPreview() {
  var kw = (document.getElementById('vfmKeyword').value || '').trim().toUpperCase();
  var box = document.getElementById('vfmPreviewBox');
  var btn = document.getElementById('vfmApplyBtn');
  if (!kw) { box.innerHTML = ''; btn.disabled = true; return; }
  var contas = getActiveContas().filter(function(c) { return (c.titulo || '').toUpperCase().includes(kw); });
  if (contas.length === 0) {
    box.innerHTML = '<span style="color:var(--gray-400);">Nenhuma conta encontrada com "' + escapeHtml(kw) + '" no título.</span>';
    btn.disabled = true;
  } else {
    box.innerHTML = '<strong>' + contas.length + ' conta' + (contas.length !== 1 ? 's' : '') + ' encontrada' + (contas.length !== 1 ? 's' : '') + '</strong> — ex: ' +
      contas.slice(0, 3).map(function(c) { return escapeHtml(c.titulo || '(sem título)'); }).join(', ') + (contas.length > 3 ? '...' : '');
    btn.disabled = false;

}

function aplicarVincularFornecedorEmMassa() {
  var kw = (document.getElementById('vfmKeyword').value || '').trim().toUpperCase();
  var fornecedorId = document.getElementById('vfmFornecedor').value;
  if (!kw || !fornecedorId) { toast('Preencha a palavra-chave e escolha o fornecedor.', 'error'); return; }

  var forn = state.fornecedores.find(function(f) { return f.id === fornecedorId; });
  var contas = getActiveContas().filter(function(c) { return (c.titulo || '').toUpperCase().includes(kw); });
  if (contas.length === 0) { toast('Nenhuma conta encontrada.', 'error'); return; }

  confirmDialog(
    'Confirmar vínculo em massa',
    'Vincular o fornecedor "' + forn.nome + '" a ' + contas.length + ' conta(s) com "' + kw + '" no título? Isso substitui o fornecedor atual dessas contas, se houver.',
    function() {
      contas.forEach(function(c) {
        var idx = state.contasAPagar.findIndex(function(x) { return x.id === c.id; });
        if (idx >= 0) state.contasAPagar[idx].fornecedor_id = fornecedorId;
      });
      saveState();
      closeModal();
      render();
      toast(contas.length + ' conta(s) vinculada(s) a "' + forn.nome + '"!');
    }
  );
}

// Distribui automaticamente os 3 fornecedores fixos do Pró-labore
// (Guilherme, Mabner, Waldir) entre os lançamentos de cada mês, com uma
// regra especial: quem estiver com pagamento parcial é sempre Mabner Zocoal.
var _proLaboreProposal = [];

function _findFornecedorPorNome(nomeAlvo) {
  var alvo = nomeAlvo.trim().toUpperCase();
  return state.fornecedores.find(function(f) { return !f._deleted && (f.nome || '').trim().toUpperCase() === alvo; }) || null;
}

function showDistribuirProLabore() {
  var fGuilherme = _findFornecedorPorNome('GUILHERME AUGUSTO SOARES');
  var fMabner = _findFornecedorPorNome('MABNER ZOCOAL');
  var fWaldir = _findFornecedorPorNome('WALDIR RAMALHO');

  var faltando = [];
  if (!fGuilherme) faltando.push('Guilherme Augusto Soares');
  if (!fMabner) faltando.push('Mabner Zocoal');
  if (!fWaldir) faltando.push('Waldir Ramalho');
  if (faltando.length) {
    toast('Fornecedor(es) não encontrado(s) no cadastro: ' + faltando.join(', ') + '. Cadastre antes com esse nome exato.', 'error');
    return;
  }

  var contas = getActiveContas().filter(isProLaboreConta).sort(function(a, b) { return (a.id || '').localeCompare(b.id || ''); });

  // Agrupa por data de vencimento
  var grupos = {};
  contas.forEach(function(c) {
    var dv = c.data_vencimento || '(sem data)';
    if (!grupos[dv]) grupos[dv] = [];
    grupos[dv].push(c);
  });

  _proLaboreProposal = [];
  var linhasHtml = '';

  Object.keys(grupos).sort().forEach(function(dv) {
    var grupo = grupos[dv];
    var parciais = grupo.filter(function(c) { return c.status === 'PAGO_PARCIALMENTE'; });
    var outros = grupo.filter(function(c) { return c.status !== 'PAGO_PARCIALMENTE'; });

    var ordemLivre = [fGuilherme, fMabner, fWaldir];
    var atribuicoes = []; // {conta, fornecedor}

    parciais.forEach(function(c) {
      atribuicoes.push({ conta: c, fornecedor: fMabner });
    });

    // Para os demais, usa a ordem fixa pulando o Mabner se ele já foi usado por parcial
    var ordemParaOutros = parciais.length > 0 ? [fGuilherme, fWaldir] : [fGuilherme, fMabner, fWaldir];
    outros.forEach(function(c, i) {
      var f = ordemParaOutros[i % ordemParaOutros.length];
      atribuicoes.push({ conta: c, fornecedor: f });
    });

    atribuicoes.forEach(function(a) {
      _proLaboreProposal.push({ contaId: a.conta.id, fornecedorId: a.fornecedor.id });
      var fornAtual = state.fornecedores.find(function(f) { return f.id === a.conta.fornecedor_id; });
      linhasHtml += '<tr>' +
        '<td>' + formatDateBR(dv) + '</td>' +
        '<td>' + escapeHtml(a.conta.titulo || '') + '</td>' +
        '<td>' + formatMoney(a.conta.valor_bruto) + '</td>' +
        '<td>' + (statusLabels[a.conta.status] || a.conta.status || '') + '</td>' +
        '<td>' + (fornAtual ? escapeHtml(fornAtual.nome) : '<span style="color:var(--gray-400);">—</span>') + '</td>' +
        '<td style="font-weight:600;color:var(--primary);">&rarr; ' + escapeHtml(a.fornecedor.nome) + '</td>' +
        '</tr>';
    });
  });

  if (_proLaboreProposal.length === 0) {
    toast('Nenhum lançamento de Pró-labore encontrado.', 'error');
    return;
  }

  openModal(`
    <div class="modal-header">
      <h3>Distribuir Pró-labore</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" style="max-height:60vh;overflow:auto;">
      <p style="font-size:13px;color:var(--gray-500);margin-bottom:12px;">Confira a proposta antes de aplicar. Pagamentos parciais vão sempre para Mabner Zocoal; os demais seguem Guilherme &rarr; Waldir (ou Guilherme &rarr; Mabner &rarr; Waldir quando não há parcial no grupo).</p>
      <table style="width:100%;font-size:12px;border-collapse:collapse;">
        <thead><tr style="text-align:left;border-bottom:1px solid var(--gray-200);">
          <th style="padding:6px 8px;">Vencimento</th><th style="padding:6px 8px;">Título</th><th style="padding:6px 8px;">Valor</th><th style="padding:6px 8px;">Status</th><th style="padding:6px 8px;">Fornecedor atual</th><th style="padding:6px 8px;">Fornecedor proposto</th>
        </tr></thead>
        <tbody>${linhasHtml}</tbody>
      </table>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="aplicarDistribuirProLabore()">Aplicar ${_proLaboreProposal.length} vínculo(s)</button>
    </div>
  `, true);
}

function aplicarDistribuirProLabore() {
  _proLaboreProposal.forEach(function(p) {
    var idx = state.contasAPagar.findIndex(function(c) { return c.id === p.contaId; });
    if (idx >= 0) state.contasAPagar[idx].fornecedor_id = p.fornecedorId;
  });
  var total = _proLaboreProposal.length;
  _proLaboreProposal = [];
  saveState();
  closeModal();
  render();
  toast(total + ' lançamento(s) de Pró-labore vinculado(s)!');
}

function isProLaboreConta(c) { return (c.titulo || '').toUpperCase().includes('PRO-LABORE') || (c.titulo || '').toUpperCase().includes('PROLABORE'); }

function renderContas(container, actions) {
  actions.innerHTML = `<button class="btn btn-outline" onclick="showDistribuirProLabore()" style="margin-right:8px;">&#128101; Distribuir Pr&oacute;-labore</button><button class="btn btn-outline" onclick="showVincularFornecedorEmMassa()" style="margin-right:8px;">&#128279; Vincular fornecedor em massa</button><button class="btn btn-primary" onclick="addNewContaRow()">&#43; Nova Conta</button>`;

  const search = state.search.contas;
  const statusFilter = state.contaStatusFilter;
  const dateStart = state.contaDateStart;
  const dateEnd = state.contaDateEnd;

  let filtered = getActiveContas();

  if (search) {
    const s = search.toLowerCase();
    filtered = filtered.filter(c => {
      const forn = getActiveFornecedores().find(f => f.id === c.fornecedor_id);
      const fornNome = forn ? forn.nome.toLowerCase() : '';
      return c.titulo?.toLowerCase().includes(s) || fornNome.includes(s) || c.observacao?.toLowerCase().includes(s);
    });
  }
  if (statusFilter) filtered = filtered.filter(c => c.status === statusFilter);
  if (dateStart) filtered = filtered.filter(c => c.data_vencimento >= dateStart);
  if (dateEnd) filtered = filtered.filter(c => c.data_vencimento <= dateEnd);

  filtered = filtered.sort((a, b) => (a.data_vencimento || '').localeCompare(b.data_vencimento || ''));

  const total = filtered.length;
  const totalGeral = filtered.reduce((s, c) => s + (parseFloat(c.valor_bruto) || 0), 0);
  const totalPago = filtered.filter(c => c.status === 'PAGO').reduce((s, c) => s + (parseFloat(c.valor_bruto) || 0), 0);
  const totalVencido = filtered.filter(c => c.status === 'VENCIDO').reduce((s, c) => s + (parseFloat(c.valor_bruto) || 0), 0);

  const fornecedores = getActiveFornecedores().sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
  const fornOpts = '<option value="">Selecione</option>' + fornecedores.map(f => '<option value="' + f.id + '">' + escapeHtml(f.nome) + (f.doc ? ' - ' + maskCNPJ(f.doc) : '') + '</option>').join('');

  // Contas que apontam para um fornecedor_id que não existe na lista de
  // fornecedores carregada (ex: fornecedor cadastrado em outro dispositivo
  // que nunca sincronizou). Ajuda a identificar quem precisa de reatribuição manual.
  const contasComFornecedorOrfao = getActiveContas().filter(c => c.fornecedor_id && !fornecedores.some(f => f.id === c.fornecedor_id));

  container.innerHTML = `
    <div style="padding:0;">
      ${contasComFornecedorOrfao.length > 0 ? `
      <div style="margin-bottom:12px;padding:10px 14px;border:1px solid var(--danger-light,#fca5a5);background:var(--danger-bg,#fef2f2);border-radius:var(--radius-xs);font-size:12px;color:var(--danger-dark,#991b1b);display:flex;align-items:center;gap:8px;">
        &#9888; ${contasComFornecedorOrfao.length} conta${contasComFornecedorOrfao.length !== 1 ? 's' : ''} com fornecedor não encontrado (cadastrado em outro dispositivo que ainda não sincronizou, ou removido). Abra "Editar" nessas contas e reatribua o fornecedor.
      </div>` : ''}

function formatBRL(v) {
  return 'R$ ' + formatNumBR(v);
}

function formatDateBR(iso) {
  if (!iso) return '';
  var p = iso.split('-');
  return p.length === 3 ? (p[2] + '/' + p[1] + '/' + p[0]) : iso;
}

function changeContaStatus(id, newStatus) {
  const idx = state.contasAPagar.findIndex(c => c.id === id);
  if (idx < 0) return;
  state.contasAPagar[idx].status = newStatus;
  if (newStatus !== 'PAGO' && newStatus !== 'PAGO_PARCIALMENTE') {
    // Voltando para A Vencer/Vencido/Cancelado: zera o controle de pagamento
    state.contasAPagar[idx].valor_pago = 0;
  }
  saveState();
  toast('Status alterado para "' + (statusLabels[newStatus] || newStatus) + '"');
  render();
}

// ===== REGISTRO DE PAGAMENTO (Pago / Pago Parcialmente / Quitar Saldo Restante) =====
function showPagamentoForm(id, target) {
  const conta = state.contasAPagar.find(c => c.id === id);
  if (!conta) return;
  const valorBruto = parseFloat(conta.valor_bruto) || 0;
  const jaPago = parseFloat(conta.valor_pago) || 0;
  const saldo = Math.max(0, valorBruto - jaPago);

  const titulos = {
    'PAGO': 'Registrar Pagamento',
    'PAGO_PARCIALMENTE': 'Registrar Pagamento Parcial',
    'QUITAR': 'Quitar Saldo Restante'
  };
  const valorSugerido = target === 'PAGO_PARCIALMENTE' ? '' : saldo;

  openModal(`
    <div class="modal-header">
      <h3>${titulos[target]}</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <form onsubmit="savePagamento(event, '${id}', '${target}')">
      <div class="modal-body">
        <div style="background:var(--gray-50);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px;font-size:12px;color:var(--gray-600);display:flex;flex-direction:column;gap:3px;">
          <div><strong>${(conta.titulo||'').toUpperCase()}</strong></div>
          <div>Valor Total: <strong>${formatBRL(valorBruto)}</strong></div>
          ${jaPago > 0 ? '<div>Já Pago: <strong>' + formatBRL(jaPago) + '</strong></div>' : ''}
          <div>Saldo Restante: <strong id="pg_saldo_atual">${formatBRL(saldo)}</strong></div>
        </div>
        <div class="form-grid" style="gap:10px;">
          <div>
            <div class="form-group" style="gap:3px;">
              <label>Data do Pagamento *</label>
              <input type="date" id="pg_data" value="${new Date().toISOString().slice(0,10)}" required style="width:100%;">
            </div>
          </div>
          <div>
            <div class="form-group" style="gap:3px;">
              <label>Valor Pago Agora *</label>
              <input type="text" inputmode="decimal" id="pg_valor" value="${valorSugerido === '' ? '' : formatNumBR(valorSugerido)}" placeholder="0,00" required style="width:100%;" onfocus="this.value=numToPlainBR(parseNumBR(this.value))" onblur="this.value=formatNumBR(this.value); atualizaSaldoPreview(${valorBruto}, ${jaPago})" oninput="atualizaSaldoPreview(${valorBruto}, ${jaPago})">
            </div>
          </div>
          <div class="full">
            <div class="form-group" style="gap:3px;">
              <label>Observação</label>
              <textarea id="pg_obs" style="width:100%;text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()"></textarea>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Confirmar</button>
      </div>
    </form>
  `);
  setTimeout(function() { var v = document.getElementById('pg_valor'); if (v) v.focus(); }, 50);
}

function atualizaSaldoPreview(valorBruto, jaPago) {
  var input = document.getElementById('pg_valor');
  var saldoEl = document.getElementById('pg_saldo_atual');
  if (!input || !saldoEl) return;
  var digitado = parseNumBR(input.value) || 0;
  var novoSaldo = Math.max(0, valorBruto - jaPago - digitado);
  saldoEl.textContent = formatBRL(novoSaldo);
}

function savePagamento(event, id, target) {
  event.preventDefault();
  const idx = state.contasAPagar.findIndex(c => c.id === id);
  if (idx < 0) return;

  const data = document.getElementById('pg_data').value;
  const valor = parseNumBR(document.getElementById('pg_valor').value);
  const obs = document.getElementById('pg_obs').value.trim().toUpperCase();

  if (!data) { toast('Informe a data do pagamento', 'error'); return; }
  if (!valor || valor <= 0) { toast('Informe o valor pago', 'error'); return; }

  const conta = state.contasAPagar[idx];
  const valorBruto = parseFloat(conta.valor_bruto) || 0;
  const jaPago = parseFloat(conta.valor_pago) || 0;
  const novoTotalPago = jaPago + valor;

  conta.valor_pago = novoTotalPago >= valorBruto ? valorBruto : novoTotalPago;
  conta.data_pagamento = data;
  if (obs) {
    conta.observacao = (conta.observacao ? conta.observacao + ' | ' : '') + obs;
  }
  conta.status = novoTotalPago >= valorBruto ? 'PAGO' : 'PAGO_PARCIALMENTE';

  saveState();
  closeModal();
  render();
  toast(conta.status === 'PAGO' ? 'Conta quitada com sucesso!' : 'Pagamento parcial registrado!');
}

// Backup completo: baixa um único arquivo JSON com todos os módulos do
// sistema (produtos, clientes, preços, atribuições, fornecedores, contas a
// pagar, pedidos de venda), com carimbo de data/hora. Serve como cópia de
// segurança independente do Supabase, que qualquer usuário logado pode gerar
// com um clique, sem precisar entrar no painel do banco de dados.
function exportAllBackup() {
  var agora = new Date();
  var dataStr = agora.getFullYear() + '-' + String(agora.getMonth() + 1).padStart(2, '0') + '-' + String(agora.getDate()).padStart(2, '0');
  var horaStr = String(agora.getHours()).padStart(2, '0') + 'h' + String(agora.getMinutes()).padStart(2, '0');

  var backup = {
    gerado_em: agora.toISOString(),
    gerado_por: (currentUser && currentUser.email) || 'desconhecido',
    produtos: state.products || [],
    clientes: state.clients || [],
    precos: state.prices || {},
    atribuicoes: state.assigned || {},
    fornecedores: getActiveFornecedores(),
    contas_a_pagar: getActiveContas(),
    pedidos_venda: (state.pedidosVenda || []).filter(function(p) { return !p._deleted; }),
    contas_a_receber: getActiveRecebiveis(),
    cheques: getActiveCheques(),
    operacoes_fidc: getActiveOperacoesFidc()
  };

  var resumo = 'Produtos: ' + backup.produtos.length +
    ' | Clientes: ' + backup.clientes.length +
    ' | Fornecedores: ' + backup.fornecedores.length +
    ' | Contas a Pagar: ' + backup.contas_a_pagar.length +
    ' | Pedidos de Venda: ' + backup.pedidos_venda.length +
    ' | Contas a Receber: ' + backup.contas_a_receber.length +
    ' | Cheques: ' + backup.cheques.length +
    ' | Operações FIDC: ' + backup.operacoes_fidc.length;

  var blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'backup_completo_' + dataStr + '_' + horaStr + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  toast('Backup completo baixado! ' + resumo);
}

// Gera um backup local (JSON + CSV) da lista de fornecedores cadastrados,
// pra qualquer usuário poder guardar uma cópia de segurança fora do
// Supabase, sem precisar mexer no painel do banco de dados.
function exportFornecedoresBackup() {
  var lista = getActiveFornecedores().sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
  if (lista.length === 0) { toast('Nenhum fornecedor cadastrado para exportar.', 'error'); return; }

  var agora = new Date();
  var dataStr = agora.getFullYear() + '-' + String(agora.getMonth() + 1).padStart(2, '0') + '-' + String(agora.getDate()).padStart(2, '0');
  var horaStr = String(agora.getHours()).padStart(2, '0') + 'h' + String(agora.getMinutes()).padStart(2, '0');

  function baixar(conteudo, nomeArquivo, mime) {
    var blob = new Blob([conteudo], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = nomeArquivo;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // JSON completo (fácil de reimportar/consultar programaticamente)
  baixar(JSON.stringify(lista, null, 2), 'fornecedores_backup_' + dataStr + '_' + horaStr + '.json', 'application/json');

  // CSV (fácil de abrir no Excel/Sheets)
  var header = 'Nome;Documento;Email;Telefone\n';
  var linhas = lista.map(function(f) {
    return [f.nome, f.doc, f.email, f.telefone].map(function(v) {
      v = (v || '').toString().replace(/;/g, ',');
      return v;
    }).join(';');
  }).join('\n');
  setTimeout(function() {
    baixar('\uFEFF' + header + linhas, 'fornecedores_backup_' + dataStr + '_' + horaStr + '.csv', 'text/csv;charset=utf-8');
  }, 300);

  toast(lista.length + ' fornecedor' + (lista.length !== 1 ? 'es' : '') + ' exportado' + (lista.length !== 1 ? 's' : '') + '!');
}

function addFornecedorRapido(contaId) {
  const nome = prompt('Nome do novo fornecedor:');
  if (!nome || !nome.trim()) return;
  const novoFor = { id: uid(), nome: nome.trim().toUpperCase(), doc: '', email: '', telefone: '' };
  state.fornecedores.push(novoFor);
  saveState();
  toast('Fornecedor "' + novoFor.nome + '" cadastrado!');
  render();
  if (contaId) {
    setTimeout(function() {
      var idx = state.contasAPagar.findIndex(c => c.id === contaId);
      if (idx >= 0) { state.contasAPagar[idx].fornecedor_id = novoFor.id; saveState(); render(); }
    }, 100);
  }
}

// ===== DROPDOWN =====
function toggleDropdown(id) {
  var dd = document.getElementById(id);
  if (!dd) return;
  var isOpen = dd.classList.contains('open');
  document.querySelectorAll('.dropdown-menu.open').forEach(function(el) {
    el.classList.remove('open');
    el.style.position = '';
    el.style.left = '';
    el.style.right = '';
    el.style.top = '';
    el.style.bottom = '';
    el.style.zIndex = '';
  });
  if (!isOpen) {
    var btn = dd.previousElementSibling;
    if (btn) {
      var rect = btn.getBoundingClientRect();
      dd.style.position = 'fixed';
      dd.style.zIndex = '99999';
      dd.style.left = 'auto';
      var ddHeight = dd.scrollHeight || 250;
      var spaceBelow = window.innerHeight - rect.bottom;
      if (spaceBelow < ddHeight + 8) {
        dd.style.bottom = (window.innerHeight - rect.top + 4) + 'px';
        dd.style.right = (window.innerWidth - rect.right) + 'px';
        dd.style.top = 'auto';
      } else {
        dd.style.top = (rect.bottom + 4) + 'px';
        dd.style.right = (window.innerWidth - rect.right) + 'px';
        dd.style.bottom = 'auto';
      }
    }
    dd.classList.add('open');
  }
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.dropdown-wrap')) {
    document.querySelectorAll('.dropdown-menu.open').forEach(function(el) {
      el.classList.remove('open');
      el.style.position = '';
      el.style.left = '';
      el.style.right = '';
      el.style.top = '';
      el.style.bottom = '';

function showContaForm(id) {
  const conta = state.contasAPagar.find(c => c.id === id);
  if (!conta) return;
  const fornecedores = getActiveFornecedores().sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
  const fornOpts = '<option value="">Selecione</option>' + fornecedores.map(f => '<option value="' + f.id + '"' + (conta.fornecedor_id === f.id ? ' selected' : '') + '>' + f.nome + (f.doc ? ' - ' + maskCNPJ(f.doc) : '') + '</option>').join('');

  openModal(`
    <div class="modal-header">
      <h3>Editar Conta a Pagar</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <form onsubmit="saveConta(event, '${id}')">
      <div class="modal-body">
        <div class="form-grid" style="gap:10px;">
          <div class="full">
            <div class="form-group" style="gap:3px;">
              <label>Título *</label>
              <input type="text" id="ct_titulo" list="titulos_list" value="${(conta.titulo || '').replace(/"/g,'&quot;')}" required style="text-transform:uppercase;width:100%;" oninput="this.value=this.value.toUpperCase()">
            </div>
          </div>
          <div class="full">
            <div class="form-group" style="gap:3px;">
              <label>Fornecedor *</label>
              <select id="ct_fornecedor" required style="width:100%;">${fornOpts}</select>
            </div>
          </div>
          <div>
            <div class="form-group" style="gap:3px;">
              <label>Vencimento *</label>
              <input type="date" id="ct_vencimento" value="${conta.data_vencimento || ''}" required style="width:100%;">
            </div>
          </div>
          <div>
            <div class="form-group" style="gap:3px;">
              <label>Pagamento</label>
              <input type="date" id="ct_pagamento" value="${conta.data_pagamento || ''}" style="width:100%;" disabled>
            </div>
          </div>
          <div>
            <div class="form-group" style="gap:3px;">
              <label>Valor Bruto *</label>
              <input type="text" inputmode="decimal" id="ct_bruto" value="${formatNumBR(conta.valor_bruto)}" required style="width:100%;" onfocus="this.value=numToPlainBR(parseNumBR(this.value))" onblur="this.value=formatNumBR(this.value)">
            </div>
          </div>
          <div>
            <div class="form-group" style="gap:3px;">
              <label>Status</label>
              <select id="ct_status" style="width:100%;" ${(conta.status === 'PAGO' || conta.status === 'PAGO_PARCIALMENTE') ? 'disabled' : ''}>

                <option value="VENCIDO" ${conta.status === 'VENCIDO' ? 'selected' : ''}>Vencido</option>
                <option value="CANCELADO" ${conta.status === 'CANCELADO' ? 'selected' : ''}>Cancelado</option>
                ${conta.status === 'PAGO' ? '<option value="PAGO" selected>Pago</option>' : ''}
                ${conta.status === 'PAGO_PARCIALMENTE' ? '<option value="PAGO_PARCIALMENTE" selected>Parcialmente</option>' : ''}
              </select>
              ${(conta.status === 'PAGO' || conta.status === 'PAGO_PARCIALMENTE') ? '<div style="font-size:11px;color:var(--gray-500);margin-top:4px;">Para alterar pagamentos, use as opções "Pago", "Parcialmente" ou "Quitar Saldo Restante" no menu &#8943; da conta.</div>' : ''}

            <div class="form-group" style="gap:3px;">
              <label>Observação</label>
              <textarea id="ct_obs" style="width:100%;text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()">${conta.observacao || ''}</textarea>

    </form>
  `);

}

function saveConta(event, id) {
  event.preventDefault();
  const idx = state.contasAPagar.findIndex(c => c.id === id);
  if (idx < 0) return;

  const titulo = document.getElementById('ct_titulo').value.trim();
  const fornecedor_id = document.getElementById('ct_fornecedor').value;
  const data_vencimento = document.getElementById('ct_vencimento').value;
  const data_pagamento = document.getElementById('ct_pagamento').value;
  const valor_bruto = parseNumBR(document.getElementById('ct_bruto').value);
  const statusEscolhido = document.getElementById('ct_status').value;
  const observacao = document.getElementById('ct_obs').value.trim().toUpperCase();

  if (!titulo) { toast('Informe o título', 'error'); return; }
  if (!fornecedor_id) { toast('Selecione o fornecedor', 'error'); return; }
  if (!data_vencimento) { toast('Informe a data de vencimento', 'error'); return; }
  if (!valor_bruto || valor_bruto <= 0) { toast('Informe o valor bruto', 'error'); return; }

  state.contasAPagar[idx].titulo = titulo;
  state.contasAPagar[idx].fornecedor_id = fornecedor_id;
  state.contasAPagar[idx].data_vencimento = data_vencimento;
  state.contasAPagar[idx].data_pagamento = data_pagamento;
  state.contasAPagar[idx].valor_bruto = valor_bruto;
  state.contasAPagar[idx].observacao = observacao;
  // Se o usuário escolheu manualmente Cancelado/Pago Parcialmente, respeita a escolha;
  // caso contrário, recalcula A Vencer/Vencido/Pago com base nas datas.
  state.contasAPagar[idx].status = (statusEscolhido === 'CANCELADO' || statusEscolhido === 'PAGO_PARCIALMENTE' || statusEscolhido === 'PAGO')
    ? statusEscolhido
    : calcStatus(data_vencimento, data_pagamento);

  saveState();
  closeModal();
  render();
  toast('Conta atualizada!');
}

function renderPedidoItensBody() {
  const body = document.getElementById('pedidoItensBody');
  const empty = document.getElementById('pedidoItensEmpty');
  if (!body) return;

  const clienteEl = document.getElementById('pd_cliente');
  const clienteId = clienteEl ? clienteEl.value : '';
  const assignedIds = clienteId ? (state.assigned[clienteId] || []) : null;

  let produtos = getActiveProducts();
  if (clienteId && assignedIds) {
    produtos = produtos.filter(function(p) { return assignedIds.includes(p.id); });
  }
  produtos = produtos.sort(function(a, b) { return (a.nome || '').localeCompare(b.nome || '', 'pt-BR'); });

  const prodOptsHtml = function(selected) {
    let lista = produtos.slice();
    if (selected && !lista.some(function(p) { return p.id === selected; })) {
      const prodObj = state.products.find(function(p) { return p.id === selected; });
      if (prodObj) lista = [prodObj].concat(lista);
    }
    if (!lista.length) {
      return '<option value="">Nenhum produto dispon&iacute;vel</option>';
    }
    return '<option value="">Selecione o produto</option>' + lista.map(function(p) {
      return '<option value="' + p.id + '"' + (selected === p.id ? ' selected' : '') + '>' + escapeHtml(p.nome) + '</option>';
    }).join('');
  };

  if (_pedidoItensEdit.length === 0) {
    body.innerHTML = '';
    if (empty) empty.style.display = 'block';
    updatePedidoTotal();
    return;
  }

  if (empty) empty.style.display = 'none';

  body.innerHTML = _pedidoItensEdit.map(function(it, idx) {
    const totalItem = (parseFloat(it.qtd) || 0) * (parseFloat(it.valor_unitario) || 0);
    const t1 = idx * 3 + 1;
    const t2 = idx * 3 + 2;
    const t3 = idx * 3 + 3;
    return '<tr style="border-bottom:1px solid var(--gray-100);">' +
      '<td style="padding:8px 12px;"><select tabindex="' + t1 + '" style="width:100%;padding:7px 10px;border:1px solid var(--gray-300);border-radius:6px;font-size:12px;font-family:inherit;background:white;" onchange="updatePedidoItemField(' + idx + ',\'produto_id\',this.value)">' + prodOptsHtml(it.produto_id) + '</select></td>' +
      '<td style="padding:8px 12px;"><input type="number" min="0" step="1" tabindex="' + t2 + '" value="' + it.qtd + '" style="width:100%;padding:7px 10px;border:1px solid var(--gray-300);border-radius:6px;font-size:12px;text-align:right;font-family:inherit;" oninput="updatePedidoItemField(' + idx + ',\'qtd\',this.value)"></td>' +
      '<td style="padding:8px 12px;"><input type="text" inputmode="decimal" tabindex="' + t3 + '" value="' + formatNumBR(it.valor_unitario) + '" style="width:100%;padding:7px 10px;border:1px solid var(--gray-300);border-radius:6px;font-size:12px;text-align:right;font-family:inherit;" onfocus="this.value=numToPlainBR(parseNumBR(this.value))" onblur="this.value=formatNumBR(parseNumBR(this.value)); updatePedidoItemField(' + idx + ',\'valor_unitario\',parseNumBR(this.value))" oninput="updatePedidoItemField(' + idx + ',\'valor_unitario\',parseNumBR(this.value))"></td>' +
      '<td id="pedItemTotal_' + idx + '" style="padding:8px 12px;text-align:right;font-weight:700;color:var(--gray-700);font-size:12px;">' + formatBRL(totalItem) + '</td>' +
      '<td style="padding:8px 12px;text-align:center;"><button type="button" onclick="removePedidoItemRow(' + idx + ')" style="background:var(--danger-bg);color:var(--danger);border:none;width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;" title="Remover">&times;</button></td>' +
    '</tr>';
  }).join('');

  updatePedidoTotal();
}

function updatePedidoTotal() {
  const totalPedido = _pedidoItensEdit.reduce(function(s, it) { return s + ((parseFloat(it.qtd) || 0) * (parseFloat(it.valor_unitario) || 0)); }, 0);
  const totalEl = document.getElementById('pd_valor_total');
  if (totalEl) totalEl.textContent = formatBRL(totalPedido);
}

// Updates only the "total" cell of a row + the grand total, without touching
// the rest of the table's DOM. This avoids rebuilding the <select>/<input>
// elements (and stealing focus) every time the user types a qty or a price,
// which is what was causing the fields to become "stuck" while typing and
// the NotFoundError when clicking "Adicionar Produto" right after editing a value.
function updatePedidoItemRowTotal(idx) {
  const it = _pedidoItensEdit[idx];
  if (!it) return;
  const totalItem = (parseFloat(it.qtd) || 0) * (parseFloat(it.valor_unitario) || 0);
  const cell = document.getElementById('pedItemTotal_' + idx);
  if (cell) cell.textContent = formatBRL(totalItem);
  updatePedidoTotal();
}

function updatePedidoItemField(idx, field, value) {
  if (!_pedidoItensEdit[idx]) return;
  _pedidoItensEdit[idx][field] = (field === 'qtd' || field === 'valor_unitario') ? (parseFloat(value) || 0) : value;

  if (field === 'produto_id') {
    const clienteEl = document.getElementById('pd_cliente');
    const clienteId = clienteEl ? clienteEl.value : '';
    if (clienteId && value) {
      const preco = state.prices[clienteId + '_' + value];
      if (preco !== undefined && preco !== null && preco !== '') {
        _pedidoItensEdit[idx].valor_unitario = parseFloat(preco) || 0;
      }
    }

    // Only a produto_id change needs a full re-render (the <select> options
    // list and the price of that row can change). Re-render just this once
    // and restore focus to the qty field of the same row.
    renderPedidoItensBody();
    setTimeout(function() {
      var rows = document.querySelectorAll('#pedidoItensBody tr');
      if (rows[idx]) {
        var el = rows[idx].querySelectorAll('input')[0];
        if (el) { el.focus(); el.select && el.select(); }
      }
    }, 30);
  } else {
    // qtd / valor_unitario: update the model and just the total cells in
    // place. No innerHTML rebuild, so the field the user is actively typing
    // in is never destroyed/recreated.
    updatePedidoItemRowTotal(idx);
  }
}

function addPedidoItemRow() {
  _pedidoItensEdit.push({ produto_id: '', qtd: 1, valor_unitario: 0 });
  renderPedidoItensBody();
  setTimeout(function() {
    var selects = document.querySelectorAll('#pedidoItensBody select');
    if (selects.length) selects[selects.length - 1].focus();
  }, 50);
}

function removePedidoItemRow(idx) {
  _pedidoItensEdit.splice(idx, 1);
  renderPedidoItensBody();
}

function savePedidoModal() {
  const pedidoId = _pedidoEditId;
  const cliente_id = document.getElementById('pd_cliente').value;
  const numero_pedido = document.getElementById('pd_numero').value.trim();
  const data_pedido = document.getElementById('pd_data_pedido').value;
  const data_entrega = document.getElementById('pd_data_entrega').value;

  if (!cliente_id) { toast('Selecione o cliente', 'error'); return; }
  if (!numero_pedido) { toast('Informe o n&ordm; do pedido', 'error'); return; }
  if (!data_pedido) { toast('Informe a data do pedido', 'error'); return; }

  const itensValidos = _pedidoItensEdit.filter(function(it) { return it.produto_id && (parseFloat(it.qtd) || 0) > 0; });
  if (!itensValidos.length) { toast('Adicione ao menos um produto com quantidade', 'error'); return; }

  const pid = pedidoId || uid();
  if (pedidoId) {
    state.pedidosVenda = state.pedidosVenda.filter(function(p) { return p.pedido_id !== pedidoId; });
  }

  itensValidos.forEach(function(it) {
    state.pedidosVenda.push({
      id: uid(),
      pedido_id: pid,
      cliente_id: cliente_id,
      numero_pedido: numero_pedido,
      data_pedido: data_pedido,
      data_entrega: data_entrega,
      produto_id: it.produto_id,
      qtd: parseFloat(it.qtd) || 0,
      valor_unitario: parseFloat(it.valor_unitario) || 0,
      valor_total: (parseFloat(it.qtd) || 0) * (parseFloat(it.valor_unitario) || 0),
      status_pedido: pedidoId ? (state.pedidosVenda.find(function(p) { return p.pedido_id === pedidoId; }) || {}).status_pedido || 'PENDENTE' : 'PENDENTE',
      data_status: pedidoId ? (state.pedidosVenda.find(function(p) { return p.pedido_id === pedidoId; }) || {}).data_status || '' : '',
      obs_status: pedidoId ? (state.pedidosVenda.find(function(p) { return p.pedido_id === pedidoId; }) || {}).obs_status || '' : ''
    });
  });

  let msgReceb = '';
  if (!pedidoId) {
    // Novo pedido: gera automaticamente as Contas a Receber conforme a condição de pagamento informada.
    const valorPedidoTotal = itensValidos.reduce(function(s, it) { return s + ((parseFloat(it.qtd) || 0) * (parseFloat(it.valor_unitario) || 0)); }, 0);
    const formaReceb = (document.getElementById('pd_forma_receb') || {}).value || 'PIX';
    const numParcelas = Math.max(1, parseInt((document.getElementById('pd_parcelas') || {}).value, 10) || 1);
    const primeiroVenc = (document.getElementById('pd_primeiro_vencimento') || {}).value || data_pedido;
    const intervalo = Math.max(1, parseInt((document.getElementById('pd_intervalo_parcelas') || {}).value, 10) || 30);
    gerarRecebiveisDoPedido(pid, cliente_id, numero_pedido, valorPedidoTotal, formaReceb, numParcelas, primeiroVenc, intervalo);
    msgReceb = ' e lançado em Contas a Receber';
  }

  saveState();
  closePedidoModal();
  render();
  toast(pedidoId ? 'Pedido atualizado!' : 'Pedido cadastrado com ' + itensValidos.length + ' produto' + (itensValidos.length > 1 ? 's' : '') + msgReceb + '!');
}

// Gera N parcelas em Contas a Receber para um pedido de venda recém-criado.
function gerarRecebiveisDoPedido(pedidoId, clienteId, numeroPedido, valorTotal, forma, numParcelas, primeiroVencimento, intervaloDias) {
  if (!valorTotal || valorTotal <= 0) return;
  const valorParcela = Math.floor((valorTotal / numParcelas) * 100) / 100;
  let somaParcelas = 0;
  for (let i = 0; i < numParcelas; i++) {
    const isUltima = i === numParcelas - 1;
    const valor = isUltima ? Math.round((valorTotal - somaParcelas) * 100) / 100 : valorParcela;
    somaParcelas += valor;
    const dataBase = primeiroVencimento ? new Date(primeiroVencimento + 'T00:00:00') : new Date();
    dataBase.setDate(dataBase.getDate() + (intervaloDias * i));
    const vencimento = dataBase.getFullYear() + '-' + String(dataBase.getMonth() + 1).padStart(2, '0') + '-' + String(dataBase.getDate()).padStart(2, '0');
    state.contasAReceber.push({
      id: uid(),
      tipo: 'NORMAL',
      pedido_id: pedidoId,
      cliente_id: clienteId,
      titulo: 'PEDIDO ' + (numeroPedido || '') + (numParcelas > 1 ? ' - PARCELA ' + (i + 1) + '/' + numParcelas : ''),
      data_vencimento: vencimento,
      data_recebimento: '',
      valor_bruto: valor,
      valor_pago: 0,
      valor_utilizado: 0,
      forma_recebimento: forma,
      status: calcStatus(vencimento, ''),
      observacao: ''
    });
  }
}

function confirmGerarRecebiveisManual(event, pedidoId) {
  event.preventDefault();
  const pedido = getPedidosAgrupados().find(function(p) { return p.pedido_id === pedidoId; });
  if (!pedido) return;
  const forma = document.getElementById('gr_forma').value;
  const parcelas = Math.max(1, parseInt(document.getElementById('gr_parcelas').value, 10) || 1);
  const venc = document.getElementById('gr_venc').value;

  gerarRecebiveisDoPedido(pedidoId, pedido.cliente_id, pedido.numero_pedido, pedido.valor_pedido, forma, parcelas, venc, intervalo);

  closeModal();

}

function savePedidoStatus(event, pedidoId, newStatus) {
  event.preventDefault();
  var dataStatusEl = document.getElementById('ps_data');
  var dataStatus = dataStatusEl ? dataStatusEl.value : '';
  var obsStatus = document.getElementById('ps_obs').value.trim().toUpperCase();
  var dataEntregaEl = document.getElementById('ps_data_entrega');
  var dataEntrega = dataEntregaEl ? dataEntregaEl.value : '';

  if ((newStatus === 'CONCLUIDO' || newStatus === 'PARCIAL') && !dataEntrega) { toast('Informe a data de entrega', 'error'); return; }
  if ((newStatus !== 'CONCLUIDO' && newStatus !== 'PARCIAL') && !dataStatus) { toast('Informe a data da alteração', 'error'); return; }

  state.pedidosVenda.forEach(function(p) {
    if (p.pedido_id === pedidoId) {
      p.status_pedido = newStatus;
      p.obs_status = obsStatus;
      if (newStatus === 'CONCLUIDO' || newStatus === 'PARCIAL') {
        p.data_status = dataEntrega;
      } else {
        p.data_status = dataStatus;
      }
    }
  });

  saveState();
  closeModal();
  render();

  var statusLabels = { 'PENDENTE': 'Pendente', 'CONCLUIDO': 'Concluído', 'PARCIAL': 'Parcialmente', 'CANCELADO': 'Cancelado' };
  toast('Status alterado para "' + (statusLabels[newStatus] || newStatus) + '"');
}

function calcStatus(dataVencimento, dataPagamento) {
  if (dataPagamento) return 'PAGO';
  if (!dataVencimento) return 'A_VENCER';
  var now = new Date();
  var today = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  return dataVencimento <= today ? 'VENCIDO' : 'A_VENCER';
}

// Reavalia o status (A_VENCER / VENCIDO) de todas as contas em aberto,
// comparando a data de vencimento com a data de hoje. Contas PAGO,
// PAGO_PARCIALMENTE ou CANCELADO não são alteradas (status "definitivo").
// Isso corrige o caso de um título ficar travado como "A Vencer" mesmo
// depois que o prazo já passou, já que antes o status só era recalculado
// quando o usuário editava manualmente a data.
function recalcAllContasStatus() {
  var mudou = false;
  (state.contasAPagar || []).forEach(function(c) {
    if (c._deleted) return;
    if (c.status === 'PAGO' || c.status === 'PAGO_PARCIALMENTE' || c.status === 'CANCELADO') return;
    var novo = calcStatus(c.data_vencimento, c.data_pagamento);
    if (novo !== c.status) { c.status = novo; mudou = true; }
  });
  return mudou;
}

function updateNewContaStatus() {
  var dv = document.getElementById('new_ct_vencimento').value;

  badge.textContent = statusLabels[st] || st;

}

function setWeekdayPreset(preset) {
  var pills = document.querySelectorAll('#weekdayPills .weekday-pill');
  if (!pills.length) return;
  var dv = document.getElementById('new_ct_vencimento') ? document.getElementById('new_ct_vencimento').value : '';
  var startDow = dv ? new Date(dv + 'T00:00:00').getDay() : null;
  pills.forEach(function(p) { p.classList.remove('active'); });
  if (preset === 'mesmo') {
    if (startDow !== null) pills[startDow].classList.add('active');
    else pills[new Date().getDay()].classList.add('active');
  } else if (preset === 'uteis') {
    [1, 2, 3, 4, 5].forEach(function(d) { pills[d].classList.add('active'); });
  } else if (preset === 'sexta') {
    pills[5].classList.add('active');
  } else if (preset === 'todos') {
    pills.forEach(function(p) { p.classList.add('active'); });
  }
}

function formatDateISO(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// Calcula as datas de vencimento das ocorrências repetidas.
// freq: 'semanal' (usa weekdays, 0=Dom..6=Sáb) ou 'mensal' (mesmo dia do mês)
function computeRecurrenceDates(startStr, freq, weekdays, occurrences, endStr) {
  var results = [];
  if (!startStr) return results;
  var start = new Date(startStr + 'T00:00:00');
  var end = endStr ? new Date(endStr + 'T00:00:00') : null;
  var maxOcc = (occurrences && occurrences > 0) ? Math.min(occurrences, 200) : 4;

  if (freq === 'mensal') {
    for (var i = 0; i < maxOcc; i++) {
      var d = new Date(start.getFullYear(), start.getMonth() + i, start.getDate());
      if (d.getDate() !== start.getDate()) {
        // Mês sem esse dia (ex: 31 em mês de 30 dias): usa o último dia do mês
        d = new Date(start.getFullYear(), start.getMonth() + i + 1, 0);
      }
      if (end && d > end) break;
      results.push(formatDateISO(d));
    }
  } else {
    var days = (weekdays && weekdays.length) ? weekdays.slice() : [start.getDay()];
    var cursor = new Date(start);
    var count = 0, safety = 0;
    while (count < maxOcc && safety < 800) {
      safety++;
      if (days.indexOf(cursor.getDay()) !== -1) {
        if (end && cursor > end) break;
        results.push(formatDateISO(cursor));
        count++;
      }
      cursor.setDate(cursor.getDate() + 1);
    }
  }
  return results;
}

function saveNewConta() {
  const titulo = document.getElementById('new_ct_titulo').value.trim();
  const fornecedor_id = document.getElementById('new_ct_fornecedor').value;
  const data_vencimento = document.getElementById('new_ct_vencimento').value;
  const valor_bruto = parseNumBR(document.getElementById('new_ct_bruto').value);

  if (!titulo) { toast('Informe o título', 'error'); document.getElementById('new_ct_titulo').focus(); return; }
  if (!fornecedor_id) { toast('Selecione o fornecedor', 'error'); document.getElementById('new_ct_fornecedor').focus(); return; }
  if (!data_vencimento) { toast('Informe a data de vencimento', 'error'); document.getElementById('new_ct_vencimento').focus(); return; }
  if (!valor_bruto || valor_bruto <= 0) { toast('Informe o valor bruto', 'error'); document.getElementById('new_ct_bruto').focus(); return; }

  const pagamento = document.getElementById('new_ct_pagamento').value;
  const observacao = document.getElementById('new_ct_obs').value.trim().toUpperCase();

  const repeatChk = document.getElementById('new_ct_repeat_enable');
  const repeatEnabled = !!(repeatChk && repeatChk.checked);

  let dates = [data_vencimento];
  if (repeatEnabled) {
    const freq = document.getElementById('new_ct_repeat_freq').value;
    const countInput = document.getElementById('new_ct_repeat_count');
    const endDateInput = document.getElementById('new_ct_repeat_end');
    const endDate = endDateInput.value || '';
    const count = endDate ? 999 : ((countInput.value && parseInt(countInput.value, 10) > 0) ? parseInt(countInput.value, 10) : 4);
    let weekdays = [];
    if (freq === 'semanal') {
      document.querySelectorAll('#weekdayPills .weekday-pill.active').forEach(function(p) {
        weekdays.push(parseInt(p.getAttribute('data-day'), 10));
      });
    }
    const generated = computeRecurrenceDates(data_vencimento, freq, weekdays, count, endDate);
    if (generated.length) dates = generated;
  }

  dates.forEach(function(dv, idx) {
    const dpForThis = idx === 0 ? pagamento : '';
    const status = calcStatus(dv, dpForThis);
    state.contasAPagar.push({
      id: uid(),
      titulo,
      fornecedor_id,
      data_vencimento: dv,
      data_pagamento: (idx === 0 && status === 'PAGO' && !dpForThis) ? new Date().toISOString().slice(0, 10) : dpForThis,
      valor_bruto,
      valor_pago: status === 'PAGO' ? valor_bruto : 0,
      status,
      observacao
    });
  });

  saveState();
  toast(dates.length > 1 ? (dates.length + ' contas cadastradas (recorrência aplicada)!') : 'Conta cadastrada!');
  render();
}

function updateContaField(id, field, value) {
  const idx = state.contasAPagar.findIndex(c => c.id === id);
  if (idx < 0) return;
  state.contasAPagar[idx][field] = value.toUpperCase ? value.toUpperCase() : value;
  if (field === 'data_vencimento' || field === 'data_pagamento') {
    const c = state.contasAPagar[idx];
    if (c.status !== 'CANCELADO') {
      c.status = calcStatus(c.data_vencimento, c.data_pagamento);
    }
  }
  saveState();
  if (field === 'titulo' || field === 'fornecedor_id' || field === 'data_vencimento' || field === 'data_pagamento') render();
}

function updateContaNumeric(id, field, value) {
  const idx = state.contasAPagar.findIndex(c => c.id === id);
  if (idx < 0) return;
  state.contasAPagar[idx][field] = parseFloat(value) || 0;
  saveState();
  render();
}
