              const isCancelado = c.status === 'CANCELADO';
              const isFidc = c.status === 'DESCONTADO_FIDC';
              const isFidcLiquidado = c.status === 'LIQUIDADO_FIDC';
              const elegivelFidc = c.tipo !== 'ADIANTAMENTO' && (isAVencer || isVencido);
              const cheque = c.forma_recebimento === 'CHEQUE' ? getActiveCheques().find(function(ch) { return ch.conta_receber_id === c.id; }) : null;
              return `<tr>
                <td style="text-align:center;">${elegivelFidc ? '<input type="checkbox" ' + (_fidcSelecionados.has(c.id) ? 'checked' : '') + ' onchange="toggleFidcSelecionado(\'' + c.id + '\')">' : ''}</td>
                <td class="col-titulo" style="font-weight:600;" title="${escapeHtml(c.titulo||'')}">${escapeHtml(c.titulo||'')}${c.tipo==='ADIANTAMENTO' ? ' <span class="badge badge-info" style="font-size:9px;">ADIANT.</span>' : ''}${(isFidc||isFidcLiquidado) ? ' <span class="badge badge-warning" style="font-size:9px;">FIDC</span>' : ''}</td>
                <td class="col-forn" title="${escapeHtml(clienteNome)}">${escapeHtml(clienteNome)}</td>
                <td class="col-date">${formatDateBR(c.data_vencimento)}</td>
                <td class="col-date">${formatDateBR(c.data_recebimento)}</td>
                <td class="col-num" style="text-align:right;font-weight:600;">${formatBRL(c.valor_bruto)}</td>
                <td class="col-status" style="text-align:center;font-size:11px;">${formaLabels[c.forma_recebimento] || '-'}${cheque ? '<div style="font-size:9px;color:var(--gray-400);">' + (chequeStatusLabels[cheque.status]||'') + '</div>' : ''}</td>
                <td class="col-status">
                  <span class="badge ${statusClass}">${statusLabelsReceb[c.status] || c.status}</span>
                  ${isParcial ? '<div style="font-size:10px;color:var(--gray-500);margin-top:3px;white-space:nowrap;">Receb.: ' + formatBRL(c.valor_pago||0) + ' &middot; Saldo: ' + formatBRL((parseFloat(c.valor_bruto)||0) - (parseFloat(c.valor_pago)||0)) + '</div>' : ''}
                </td>
                <td class="col-acoes">
                  <div class="dropdown-wrap">
                    <button class="dropdown-btn" onclick="toggleDropdown('ddr_${c.id}')" title="Mais opções">&#8943;</button>
                    <div class="dropdown-menu" id="ddr_${c.id}">
                      ${!isFidc && !isFidcLiquidado ? '<button class="dropdown-item" onclick="showRecebivelForm(\'' + c.id + '\')">&#9998; Editar</button><div class="dropdown-divider"></div>' : ''}
                      ${!isRecebido && !isCancelado && !isFidc && !isFidcLiquidado ? '<button class="dropdown-item" onclick="showRecebimentoForm(\'' + c.id + '\',\'RECEBIDO\')"><span class="dot" style="background:var(--success);"></span> Receber Total</button>' : ''}
                      ${!isParcial && !isRecebido && !isCancelado && !isFidc && !isFidcLiquidado ? '<button class="dropdown-item" onclick="showRecebimentoForm(\'' + c.id + '\',\'RECEBIDO_PARCIALMENTE\')"><span class="dot" style="background:var(--primary);"></span> Receber Parcial</button>' : ''}
                      ${isParcial ? '<button class="dropdown-item" onclick="showRecebimentoForm(\'' + c.id + '\',\'QUITAR\')"><span class="dot" style="background:var(--success);"></span> Quitar Saldo Restante</button>' : ''}
                      ${elegivelFidc ? '<button class="dropdown-item" onclick="enviarUnicoParaFidc(\'' + c.id + '\')"><span class="dot" style="background:var(--warning);"></span> Enviar para Desconto FIDC</button>' : ''}
                      ${isFidc ? '<button class="dropdown-item" onclick="confirmarLiquidacaoFidcTitulo(\'' + c.id + '\')"><span class="dot" style="background:var(--success);"></span> Confirmar Pagamento pelo Sacado</button>' : ''}
                      ${isFidc ? '<button class="dropdown-item" onclick="registrarRecompraFidcTitulo(\'' + c.id + '\')"><span class="dot" style="background:var(--danger);"></span> Registrar Recompra/Chargeback</button>' : ''}
                      ${(isFidc || isFidcLiquidado) ? '<button class="dropdown-item" onclick="verOperacaoFidcDoTitulo(\'' + c.id + '\')">&#127974; Ver Operação FIDC</button>' : ''}
                      ${!isCancelado && !isFidc && !isFidcLiquidado ? '<button class="dropdown-item" onclick="changeRecebivelStatus(\'' + c.id + '\',\'CANCELADO\')"><span class="dot" style="background:var(--warning);"></span> Cancelar</button>' : ''}
                      <div class="dropdown-divider"></div>
                      <button class="dropdown-item danger" onclick="deleteRecebivel('${c.id}')">&#128465; Excluir</button>
                    </div>
                  </div>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
  atualizaFidcSelectionBar();
}

function toggleFidcSelecionado(id) {
  if (_fidcSelecionados.has(id)) _fidcSelecionados.delete(id); else _fidcSelecionados.add(id);
  atualizaFidcSelectionBar();
}

// Atalho para enviar um único título direto pelo menu de ações, sem precisar
// marcar a caixinha de seleção na tabela.
function enviarUnicoParaFidc(id) {
  document.querySelectorAll('.dropdown-menu.open').forEach(function(el) { el.classList.remove('open'); });
  _fidcSelecionados.clear();
  _fidcSelecionados.add(id);
  showEnviarFidcForm();
}

function limparSelecaoFidc() {
  _fidcSelecionados.clear();
  render();
}

function atualizaFidcSelectionBar() {
  const bar = document.getElementById('fidcSelectionBar');
  if (!bar) return;
  const selecionados = getActiveRecebiveis().filter(function(c) { return _fidcSelecionados.has(c.id); });
  if (selecionados.length === 0) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  const total = selecionados.reduce(function(s, c) { return s + (parseFloat(c.valor_bruto) || 0); }, 0);
  document.getElementById('fidcSelCount').textContent = selecionados.length;
  document.getElementById('fidcSelTotal').textContent = formatBRL(total);
}

function changeRecebivelStatus(id, newStatus) {
  document.querySelectorAll('.dropdown-menu.open').forEach(function(el) { el.classList.remove('open'); });
  const idx = state.contasAReceber.findIndex(function(c) { return c.id === id; });
  if (idx < 0) return;
  state.contasAReceber[idx].status = newStatus;
  if (newStatus !== 'RECEBIDO' && newStatus !== 'RECEBIDO_PARCIALMENTE') {
    state.contasAReceber[idx].valor_pago = 0;
  }
  saveState();
  toast('Status alterado para "' + (statusLabelsReceb[newStatus] || newStatus) + '"');
  render();
}

function deleteRecebivel(id) {
  document.querySelectorAll('.dropdown-menu.open').forEach(function(el) { el.classList.remove('open'); });
  showConfirmModal('Tem certeza que deseja excluir este título de Contas a Receber?', function() {
    state.contasAReceber.forEach(function(c) { if (c.id === id) c._deleted = true; });
    saveState(); render();
    toast('Título excluído');
  });
}

// ============================================================
// DESCONTO / CESSÃO DE RECEBÍVEIS COM FIDC
// ============================================================
const fidcOpStatusColors = { 'ATIVA': 'badge-info', 'LIQUIDADA': 'badge-success', 'COM_PENDENCIA': 'badge-warning' };
const fidcOpStatusLabels = { 'ATIVA': 'Ativa', 'LIQUIDADA': 'Liquidada', 'COM_PENDENCIA': 'Com Pendência' };

function showEnviarFidcForm() {
  const selecionados = getActiveRecebiveis().filter(function(c) { return _fidcSelecionados.has(c.id); });
  if (selecionados.length === 0) { toast('Selecione ao menos um título', 'error'); return; }
  const valorFace = selecionados.reduce(function(s, c) { return s + (parseFloat(c.valor_bruto) || 0); }, 0);

  const listaHtml = selecionados.map(function(c) {
    const cliente = state.clients.find(function(cl) { return cl.id === c.cliente_id; });
    return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--gray-100);"><span>' + escapeHtml(c.titulo||'') + ' &mdash; ' + escapeHtml(cliente ? cliente.nome : '') + '</span><span style="font-weight:600;">' + formatBRL(c.valor_bruto) + '</span></div>';
  }).join('');

  openModal(`
    <div class="modal-header"><h3>&#127974; Enviar para Desconto FIDC</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <form onsubmit="saveEnviarFidc(event)">
      <div class="modal-body">
        <div style="background:var(--gray-50);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px;max-height:160px;overflow-y:auto;">${listaHtml}</div>
        <div class="form-grid" style="gap:10px;">
          <div class="full"><div class="form-group" style="gap:3px;"><label>FIDC / Cessionário *</label><input type="text" id="fd_nome" required style="width:100%;text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()"></div></div>
          <div><div class="form-group" style="gap:3px;"><label>Data da Operação *</label><input type="date" id="fd_data" value="${new Date().toISOString().slice(0,10)}" required style="width:100%;"></div></div>
          <div><div class="form-group" style="gap:3px;"><label>Valor de Face</label><input type="text" value="${formatBRL(valorFace)}" disabled style="width:100%;background:var(--gray-100);"></div></div>
          <div><div class="form-group" style="gap:3px;"><label>Taxa de Desconto (%) *</label><input type="text" inputmode="decimal" id="fd_taxa" required style="width:100%;" placeholder="Ex: 2,5" oninput="atualizaCalculoFidc(${valorFace})"></div></div>
          <div><div class="form-group" style="gap:3px;"><label>Valor do Desconto</label><input type="text" id="fd_valor_desconto" value="R$ 0,00" disabled style="width:100%;background:var(--gray-100);"></div></div>
          <div class="full"><div class="form-group" style="gap:3px;"><label>Valor Líquido a Receber</label><input type="text" id="fd_valor_liquido" value="${formatBRL(valorFace)}" disabled style="width:100%;background:var(--gray-100);font-weight:700;"></div></div>
          <div class="full"><div class="form-group" style="gap:3px;"><label>Conta/Banco de Recebimento do Líquido</label><input type="text" id="fd_conta_receb" style="width:100%;text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()"></div></div>
          <div class="full"><div class="form-group" style="gap:3px;"><label>Observação</label><textarea id="fd_obs" style="width:100%;text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()"></textarea></div></div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button type="submit" class="btn btn-primary">Confirmar Operação</button></div>
    </form>
  `);
  setTimeout(function() { var el = document.getElementById('fd_nome'); if (el) el.focus(); }, 50);
}

function atualizaCalculoFidc(valorFace) {
  const taxaEl = document.getElementById('fd_taxa');
  const taxa = parseFloat((taxaEl.value || '0').replace(',', '.')) || 0;
  const desconto = valorFace * (taxa / 100);
  const liquido = valorFace - desconto;
  document.getElementById('fd_valor_desconto').value = formatBRL(desconto);
  document.getElementById('fd_valor_liquido').value = formatBRL(liquido);
}

function saveEnviarFidc(event) {
  event.preventDefault();
  const selecionados = getActiveRecebiveis().filter(function(c) { return _fidcSelecionados.has(c.id); });
  if (selecionados.length === 0) { toast('Nenhum título selecionado', 'error'); closeModal(); return; }

  const fidc_nome = document.getElementById('fd_nome').value.trim();
  const data_operacao = document.getElementById('fd_data').value;
  const taxa = parseFloat((document.getElementById('fd_taxa').value || '0').replace(',', '.')) || 0;
  const conta_recebimento = document.getElementById('fd_conta_receb').value.trim();
  const observacao = document.getElementById('fd_obs').value.trim().toUpperCase();

  if (!fidc_nome) { toast('Informe o nome do FIDC/cessionário', 'error'); return; }
  if (!data_operacao) { toast('Informe a data da operação', 'error'); return; }

  const valorFace = selecionados.reduce(function(s, c) { return s + (parseFloat(c.valor_bruto) || 0); }, 0);
  const valorDesconto = Math.round(valorFace * (taxa / 100) * 100) / 100;
  const valorLiquido = Math.round((valorFace - valorDesconto) * 100) / 100;

  const opId = uid();
  state.operacoesFidc.push({
    id: opId, fidc_nome: fidc_nome, data_operacao: data_operacao,
    contas_ids: selecionados.map(function(c) { return c.id; }),
    valor_face: valorFace, taxa_desconto: taxa, valor_desconto: valorDesconto,
    valor_liquido: valorLiquido, conta_recebimento: conta_recebimento,
    status: 'ATIVA', observacao: observacao
  });

  selecionados.forEach(function(c) {
    const idx = state.contasAReceber.findIndex(function(x) { return x.id === c.id; });
    if (idx >= 0) {
      state.contasAReceber[idx].status = 'DESCONTADO_FIDC';
      state.contasAReceber[idx].fidc_operacao_id = opId;
    }
  });

  _fidcSelecionados.clear();
  saveState();
  closeModal();
  render();
  toast(selecionados.length + ' título(s) enviado(s) para desconto junto ao FIDC "' + fidc_nome + '"!');
}

function verOperacaoFidcDoTitulo(contaId) {
  document.querySelectorAll('.dropdown-menu.open').forEach(function(el) { el.classList.remove('open'); });
  const conta = state.contasAReceber.find(function(c) { return c.id === contaId; });
  if (!conta || !conta.fidc_operacao_id) return;
  showOperacoesFidcModal(conta.fidc_operacao_id);
}

// Confirma que o sacado (cliente devedor) pagou diretamente ao FIDC — o
// título é encerrado apenas para fins de controle/conciliação, já que o
// dinheiro já havia sido recebido pela empresa no momento da cessão.
function confirmarLiquidacaoFidcTitulo(contaId) {
  document.querySelectorAll('.dropdown-menu.open').forEach(function(el) { el.classList.remove('open'); });
  showConfirmModal('Confirmar que o sacado quitou este título diretamente com o FIDC?', function() {
    const idx = state.contasAReceber.findIndex(function(c) { return c.id === contaId; });
    if (idx < 0) return;
    state.contasAReceber[idx].status = 'LIQUIDADO_FIDC';
    state.contasAReceber[idx].data_recebimento = state.contasAReceber[idx].data_recebimento || new Date().toISOString().slice(0,10);
    atualizaStatusOperacaoFidc(state.contasAReceber[idx].fidc_operacao_id);
    saveState(); render();
    toast('Título marcado como liquidado junto ao FIDC.');
  });
}

// Registra a recompra (chargeback/coobrigação): o sacado não pagou e a
// empresa precisa recomprar o título do FIDC. O título volta a ser
// cobrável normalmente e é lançado um débito em Contas a Pagar para o FIDC.
function registrarRecompraFidcTitulo(contaId) {
  document.querySelectorAll('.dropdown-menu.open').forEach(function(el) { el.classList.remove('open'); });
  const conta = state.contasAReceber.find(function(c) { return c.id === contaId; });
  if (!conta) return;
  const op = (state.operacoesFidc || []).find(function(o) { return o.id === conta.fidc_operacao_id; });
  openModal(`
    <div class="modal-header"><h3>Registrar Recompra / Chargeback</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <form onsubmit="saveRecompraFidc(event, '${contaId}')">
      <div class="modal-body">
        <div style="background:var(--gray-50);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px;font-size:12px;color:var(--gray-600);">
          <div><strong>${escapeHtml(conta.titulo||'')}</strong></div>
          <div>FIDC: <strong>${op ? escapeHtml(op.fidc_nome) : '-'}</strong></div>
          <div>Valor do título: <strong>${formatBRL(conta.valor_bruto)}</strong></div>
        </div>
        <div style="font-size:12px;color:var(--gray-500);margin-bottom:12px;">O título volta a ficar em aberto para cobrança do cliente, e será lançado um débito em <strong>Contas a Pagar</strong> referente ao valor de recompra pago ao FIDC.</div>
        <div class="form-grid" style="gap:10px;">
          <div><div class="form-group" style="gap:3px;"><label>Data da Recompra *</label><input type="date" id="rf_data" value="${new Date().toISOString().slice(0,10)}" required style="width:100%;"></div></div>
          <div><div class="form-group" style="gap:3px;"><label>Valor da Recompra *</label><input type="text" inputmode="decimal" id="rf_valor" value="${formatNumBR(conta.valor_bruto)}" required style="width:100%;" onfocus="this.value=numToPlainBR(parseNumBR(this.value))" onblur="this.value=formatNumBR(this.value)"></div></div>
          <div class="full"><div class="form-group" style="gap:3px;"><label>Vencimento do débito com o FIDC *</label><input type="date" id="rf_vencimento" value="${new Date().toISOString().slice(0,10)}" required style="width:100%;"></div></div>
          <div class="full"><div class="form-group" style="gap:3px;"><label>Observação</label><textarea id="rf_obs" style="width:100%;text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()"></textarea></div></div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button type="submit" class="btn btn-primary">Confirmar Recompra</button></div>
    </form>
  `);
}

function saveRecompraFidc(event, contaId) {
  event.preventDefault();
  const idx = state.contasAReceber.findIndex(function(c) { return c.id === contaId; });
  if (idx < 0) return;
  const conta = state.contasAReceber[idx];
  const op = (state.operacoesFidc || []).find(function(o) { return o.id === conta.fidc_operacao_id; });

  const data = document.getElementById('rf_data').value;
  const valor = parseNumBR(document.getElementById('rf_valor').value);
  const vencimento = document.getElementById('rf_vencimento').value;
  const obs = document.getElementById('rf_obs').value.trim().toUpperCase();

  if (!data || !valor || valor <= 0 || !vencimento) { toast('Preencha os campos obrigatórios', 'error'); return; }

  // Localiza (ou cadastra) o fornecedor referente ao FIDC para lançar a conta a pagar.
  const nomeFidc = op ? op.fidc_nome : 'FIDC';
  let fornecedor = _findFornecedorPorNome(nomeFidc);
  if (!fornecedor) {
    fornecedor = { id: uid(), nome: nomeFidc.toUpperCase(), doc: '', email: '', telefone: '', _deleted: false };
    state.fornecedores.push(fornecedor);
  }

  state.contasAPagar.push({
    id: uid(), titulo: 'RECOMPRA FIDC - ' + (conta.titulo || ''), fornecedor_id: fornecedor.id,
    data_vencimento: vencimento, data_pagamento: '', valor_bruto: valor, valor_pago: 0,
    status: calcStatus(vencimento, ''), observacao: obs
  });

  // Reabre o título para cobrança normal do cliente.
  conta.status = calcStatus(conta.data_vencimento, '');
  conta.observacao = (conta.observacao ? conta.observacao + ' | ' : '') + 'RECOMPRADO DO FIDC EM ' + formatDateBR(data) + (obs ? ' - ' + obs : '');

  if (op) {
    op.status = 'COM_PENDENCIA';
  }

  saveState();
  closeModal();
  render();
  toast('Recompra registrada! O título voltou a ficar em aberto e um débito foi lançado em Contas a Pagar.');
}

function atualizaStatusOperacaoFidc(opId) {
  const op = (state.operacoesFidc || []).find(function(o) { return o.id === opId; });
  if (!op) return;
  const titulosDaOp = getActiveRecebiveis().filter(function(c) { return c.fidc_operacao_id === opId; });
  const todosLiquidados = titulosDaOp.length > 0 && titulosDaOp.every(function(c) { return c.status === 'LIQUIDADO_FIDC'; });
  if (todosLiquidados) op.status = 'LIQUIDADA';
}

function showOperacoesFidcModal(highlightOpId) {
  const ops = getActiveOperacoesFidc().sort(function(a, b) { return (b.data_operacao || '').localeCompare(a.data_operacao || ''); });
  openModal(`
    <div class="modal-header"><h3>&#127974; Operações de Desconto FIDC</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body" style="max-height:70vh;overflow-y:auto;">
      ${ops.length === 0 ? '<div style="text-align:center;padding:32px;color:var(--gray-400);font-size:13px;">Nenhuma operação registrada ainda. Selecione títulos em Contas a Receber e clique em "Enviar para Desconto FIDC".</div>' : ''}
      ${ops.map(function(op) {
        const titulosDaOp = getActiveRecebiveis().filter(function(c) { return c.fidc_operacao_id === op.id; });
        const statusClass = fidcOpStatusColors[op.status] || 'badge-info';
        return `<div style="border:1px solid ${op.id===highlightOpId?'var(--primary)':'var(--gray-200)'};border-radius:var(--radius);padding:14px;margin-bottom:12px;${op.id===highlightOpId?'background:var(--primary-bg);':''}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <div><strong style="font-size:14px;">${escapeHtml(op.fidc_nome)}</strong><div style="font-size:11px;color:var(--gray-500);">${formatDateBR(op.data_operacao)}</div></div>
            <span class="badge ${statusClass}">${fidcOpStatusLabels[op.status] || op.status}</span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;margin-bottom:10px;">
            <div>Valor Face: <strong>${formatBRL(op.valor_face)}</strong></div>
            <div>Taxa: <strong>${(parseFloat(op.taxa_desconto)||0).toLocaleString('pt-BR')}%</strong></div>
            <div>Líquido: <strong>${formatBRL(op.valor_liquido)}</strong></div>
          </div>
          <div style="font-size:11px;color:var(--gray-500);margin-bottom:4px;">${titulosDaOp.length} título(s):</div>
          ${titulosDaOp.map(function(c) {
            const cliente = state.clients.find(function(cl) { return cl.id === c.cliente_id; });
            return '<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid var(--gray-100);"><span>' + escapeHtml(c.titulo||'') + ' &mdash; ' + escapeHtml(cliente?cliente.nome:'') + '</span><span class="badge ' + (statusColorsReceb[c.status]||'badge-info') + '" style="font-size:9px;">' + (statusLabelsReceb[c.status]||c.status) + '</span></div>';
          }).join('')}

function atualizaSaldoPreviewReceb(valorBruto, jaRecebido) {

function saveRecebimento(event, id, target) {
  event.preventDefault();
  const idx = state.contasAReceber.findIndex(function(c) { return c.id === id; });
  if (idx < 0) return;
  const c = state.contasAReceber[idx];

  const data = document.getElementById('rc_data').value;
  const valor = parseNumBR(document.getElementById('rc_valor').value);
  const forma = document.getElementById('rc_forma').value;
  const obs = document.getElementById('rc_obs').value.trim().toUpperCase();

  if (!data) { toast('Informe a data do recebimento', 'error'); return; }
  if (!valor || valor <= 0) { toast('Informe o valor recebido', 'error'); return; }

  if (forma === 'ADIANTAMENTO') {
    const aplicado = aplicarAdiantamento(c.cliente_id, valor);
    if (aplicado < valor - 0.005) {
      toast('Crédito de adiantamento insuficiente para o valor informado.', 'error');
      return;
    }
  }

  if (forma === 'CHEQUE') {
    const dataCompensacao = document.getElementById('rc_ch_compensacao').value;
    if (!dataCompensacao) { toast('Informe a data de compensação do cheque', 'error'); return; }
    state.cheques.push({
      id: uid(), conta_receber_id: c.id, cliente_id: c.cliente_id,
      numero_cheque: document.getElementById('rc_ch_numero').value.trim(),
      banco: document.getElementById('rc_ch_banco').value.trim(),
      agencia: document.getElementById('rc_ch_agencia').value.trim(),
      conta: document.getElementById('rc_ch_conta').value.trim(),
      emitente: document.getElementById('rc_ch_emitente').value.trim(),
      cpf_cnpj_emitente: document.getElementById('rc_ch_cpfcnpj').value.trim(),
      valor: valor, data_recebimento: data, data_compensacao: dataCompensacao,
      status: 'EM_CARTEIRA', observacao: obs
    });
  }

  const valorBruto = parseFloat(c.valor_bruto) || 0;
  const jaRecebido = parseFloat(c.valor_pago) || 0;
  const novoTotalRecebido = jaRecebido + valor;

  c.valor_pago = novoTotalRecebido >= valorBruto ? valorBruto : novoTotalRecebido;
  c.data_recebimento = data;
  c.forma_recebimento = forma;
  if (obs) c.observacao = (c.observacao ? c.observacao + ' | ' : '') + obs;
  c.status = novoTotalRecebido >= valorBruto ? 'RECEBIDO' : 'RECEBIDO_PARCIALMENTE';

  saveState();
  closeModal();
  render();
  toast(c.status === 'RECEBIDO' ? 'Recebimento registrado com sucesso!' : 'Recebimento parcial registrado!');
}

// Ao mudar o status de um cheque para DEVOLVIDO, o valor volta a compor o
// saldo em aberto do título vinculado em Contas a Receber (o recebimento
// registrado por aquele cheque deixa de valer).
function changeChequeStatus(id, newStatus) {
  document.querySelectorAll('.dropdown-menu.open').forEach(function(el) { el.classList.remove('open'); });
  const idx = state.cheques.findIndex(function(c) { return c.id === id; });
  if (idx < 0) return;
  const cheque = state.cheques[idx];
  const statusAnterior = cheque.status;
  cheque.status = newStatus;

  const conta = state.contasAReceber.find(function(c) { return c.id === cheque.conta_receber_id; });
  if (conta && conta.tipo !== 'ADIANTAMENTO') {
    if (newStatus === 'DEVOLVIDO' && statusAnterior !== 'DEVOLVIDO') {
      // Estorna o valor do cheque do título, reabrindo o saldo.
      conta.valor_pago = Math.max(0, (parseFloat(conta.valor_pago) || 0) - (parseFloat(cheque.valor) || 0));
      conta.status = conta.valor_pago > 0 ? 'RECEBIDO_PARCIALMENTE' : calcStatus(conta.data_vencimento, '');
    }
    if (statusAnterior === 'DEVOLVIDO' && (newStatus === 'COMPENSADO' || newStatus === 'DEPOSITADO')) {
      // Volta a considerar o cheque como recebido.
      const novoTotal = (parseFloat(conta.valor_pago) || 0) + (parseFloat(cheque.valor) || 0);
      const bruto = parseFloat(conta.valor_bruto) || 0;
      conta.valor_pago = novoTotal >= bruto ? bruto : novoTotal;
      conta.status = novoTotal >= bruto ? 'RECEBIDO' : 'RECEBIDO_PARCIALMENTE';
    }
  }

  saveState();
  toast('Cheque marcado como "' + (chequeStatusLabels[newStatus] || newStatus) + '"' + (newStatus === 'DEVOLVIDO' ? '. Saldo do título reaberto em Contas a Receber.' : ''));
  render();
}

// ============================================================
// TRANSFERÊNCIA ENTRE DISPOSITIVOS
// ============================================================
// Compressão: encurta chaves + LZW + encoding para URL
var _LZCHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=-_.!~*'()";

function lzwEncode(str) {
  if (!str) return "";
  var dict = {}, w = "", out = [], dictSize = 256;
  for (var i = 0; i < 256; i++) dict[String.fromCharCode(i)] = i;
  for (var i = 0; i < str.length; i++) {
    var c = str[i], wc = w + c;
    if (dict[wc] !== undefined) w = wc;
    else { out.push(dict[w]); dict[wc] = dictSize++; w = c; }
  }
  if (w !== "") out.push(dict[w]);
  // Valores < 64: 1 char | 64-127: marker1 + 1 | 128-4223: marker2 + 2 | demais: marker3 + 3
  var r = "";
  for (var i = 0; i < out.length; i++) {
    var v = out[i];
    if (v < 64) r += _LZCHARS[v];
    else if (v < 128) r += _LZCHARS[64] + _LZCHARS[v - 64];
    else if (v < 4224) {
      v -= 128;
      r += _LZCHARS[65] + _LZCHARS[v >> 6] + _LZCHARS[v & 63];
    } else {
      v -= 4224;
      r += _LZCHARS[66] + _LZCHARS[v >> 12] + _LZCHARS[(v >> 6) & 63] + _LZCHARS[v & 63];
    }
  }
  return r;
}

function lzwDecode(str) {
  if (!str) return null;
  var data = [], i;
  for (i = 0; i < str.length; i++) {
    var a = _LZCHARS.indexOf(str[i]);
    if (a < 0) continue;
    if (a < 64) data.push(a);
    else if (a === 64 && i + 1 < str.length) data.push(64 + _LZCHARS.indexOf(str[++i]));
    else if (a === 65 && i + 2 < str.length) {
      var b = _LZCHARS.indexOf(str[++i]), c = _LZCHARS.indexOf(str[++i]);
      data.push(128 + (b << 6) + c);
    } else if (a === 66 && i + 3 < str.length) {
      var b = _LZCHARS.indexOf(str[++i]), c = _LZCHARS.indexOf(str[++i]), d = _LZCHARS.indexOf(str[++i]);
      data.push(4224 + (b << 12) + (c << 6) + d);
    }
  }
  if (data.length === 0) return "";
  var dict = [], w, result, entry, dictSize = 256;
  for (i = 0; i < 256; i++) dict[i] = String.fromCharCode(i);
  w = dict[data[0]];
  if (w === undefined) return null;
  result = w;
  for (i = 1; i < data.length; i++) {
    var k = data[i];
    entry = dict[k] !== undefined ? dict[k] : (k === dictSize ? w + w.charAt(0) : null);
    if (entry === null) return null;
    result += entry;
    dict[dictSize++] = w + entry.charAt(0);
    w = entry;
  }
  return result;
}

function compressData(data) {
  const keyMap = {clients:'cl',products:'pr',prices:'px',assigned:'as',fornecedores:'fo',contasAPagar:'cp',pedidosVenda:'pv',
    nome:'n',fantasia:'f',doc:'d',email:'e',telefone:'t',cep:'c',
    logradouro:'l',numero:'nu',complemento:'co',bairro:'b',cidade:'ci',uf:'u',
    preco_base:'pb',tipo:'tp',grupo:'gr',sub_grupo:'sg',id:'i',
    titulo:'tt',fornecedor_id:'fi',data_vencimento:'dv',data_pagamento:'dp',
    valor_bruto:'vb',observacao:'ob',status:'st',valor_pago:'vp',
    pedido_id:'pdi',cliente_id:'cli',numero_pedido:'np',data_pedido:'dped',
    data_entrega:'dent',produto_id:'pdt',qtd:'qt',valor_unitario:'vu',valor_total:'vt',
    status_pedido:'sp',data_status:'ds',obs_status:'os'};
  function shrinkObj(obj) {
    if (Array.isArray(obj)) return obj.map(shrinkObj);
    if (obj && typeof obj === 'object') {
      var out = {};
      for (var k in obj) out[keyMap[k] || k] = shrinkObj(obj[k]);
      return out;
    }
    return obj;
  }
  return JSON.stringify(shrinkObj(data));
}

function expandData(str) {
  const revMap = {cl:'clients',pr:'products',px:'prices',as:'assigned',fo:'fornecedores',cp:'contasAPagar',pv:'pedidosVenda',
    n:'nome',f:'fantasia',d:'doc',e:'email',t:'telefone',c:'cep',
    l:'logradouro',nu:'numero',co:'complemento',b:'bairro',ci:'cidade',u:'uf',
    pb:'preco_base',tp:'tipo',gr:'grupo',sg:'sub_grupo',i:'id',
    tt:'titulo',fi:'fornecedor_id',dv:'data_vencimento',dp:'data_pagamento',
    vb:'valor_bruto',ob:'observacao',st:'status',vp:'valor_pago',
    pdi:'pedido_id',cli:'cliente_id',np:'numero_pedido',dped:'data_pedido',
    dent:'data_entrega',pdt:'produto_id',qt:'qtd',vu:'valor_unitario',vt:'valor_total',
    sp:'status_pedido',ds:'data_status',os:'obs_status'};
  function expandObj(obj) {
    if (Array.isArray(obj)) return obj.map(expandObj);
    if (obj && typeof obj === 'object') {
      var out = {};
      for (var k in obj) out[revMap[k] || k] = expandObj(obj[k]);
      return out;
    }
    return obj;
  }
  return expandObj(JSON.parse(str));
}

// QR Code gerado sem biblioteca externa — algoritmo QR simplificado via API pública de imagem
function generateQR(url) {
  const canvas = document.getElementById('qrCanvas');
  if (!canvas) return;
  // Usa a API do QR Server (gratuita, sem rastreamento de dados, só recebe a URL)
  const img = new Image();
  const apiUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&ecc=M&data=' + encodeURIComponent(url);
  img.onload = function() {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, 200, 200);
    ctx.drawImage(img, 0, 0, 200, 200);
  };
  img.onerror = function() {
    // Fallback: mostra o link para copiar
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#f1f5f9';
    ctx.fillRect(0, 0, 200, 200);
    ctx.fillStyle = '#64748b';
    ctx.font = '12px Inter,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('QR Code indisponível.', 100, 90);
    ctx.fillText('Copie o link (Opção 2).', 100, 110);
  };
  img.src = apiUrl;
}

function copyTransferLink() {
  const input = document.getElementById('transferLinkInput');
  if (!input) return;
  navigator.clipboard.writeText(input.value).then(() => {
    const status = document.getElementById('transferLinkStatus');
    if (status) { status.style.display = 'block'; setTimeout(() => { status.style.display = 'none'; }, 3000); }
  }).catch(() => {
    input.select();
    document.execCommand('copy');
    toast('Link copiado!');
  });
}

function checkImportFromUrl() {
  try {
    let importParam = null;
    const hash = window.location.hash;
    if (hash && hash.startsWith('#imp=')) {
      importParam = hash.slice(5);
    } else {
      importParam = new URLSearchParams(window.location.search).get('import');
    }
    if (!importParam) return;
    const cleanUrl = window.location.href.split('?')[0].split('#')[0];
    window.history.replaceState({}, '', cleanUrl);

    // Tenta 1º LZW (formato atual), 2º base64 (legado)
    var jsonStr = null;
    try { jsonStr = lzwDecode(importParam); } catch(_) {}
    if (!jsonStr) {
      try { jsonStr = decodeURIComponent(escape(atob(importParam))); }
      catch(e1) {
        try { jsonStr = decodeURIComponent(escape(atob(decodeURIComponent(importParam)))); }
        catch(e2) { toast('Link de importação inválido ou corrompido.', 'error'); return; }
      }
    }

    let data;
    try { data = expandData(jsonStr); } catch(e2) { data = JSON.parse(jsonStr); }
    if (!data.clients || !data.products) { toast('Link de importação inválido.', 'error'); return; }
    const hasData = state.clients.length > 0 || state.products.length > 0;
    const msg = hasData
      ? 'Este dispositivo já tem dados (' + state.clients.length + ' clientes, ' + state.products.length + ' produtos). Deseja substituir pelos dados do link (' + data.clients.length + ' clientes, ' + data.products.length + ' produtos)?'
      : 'Importar dados do link? (' + data.clients.length + ' clientes, ' + data.products.length + ' produtos)';
    if (!confirm(msg)) return;
    state.clients = data.clients || [];
    migrateClients(state.clients);
    state.products = data.products || [];
    state.prices = data.prices || {};
    state.assigned = data.assigned || {};
    state.fornecedores = data.fornecedores || [];
    state.contasAPagar = data.contasAPagar || [];
    state.pedidosVenda = data.pedidosVenda || [];
    saveState();
    render();
    toast('Transferência concluída! ' + data.clients.length + ' clientes, ' + data.products.length + ' produtos, ' + (data.fornecedores||[]).length + ' fornecedores, ' + (data.contasAPagar||[]).length + ' contas e ' + (data.pedidosVenda||[]).length + ' itens de pedidos importados.');
  } catch(e) {
    console.warn('Erro ao importar da URL:', e);
    toast('Erro ao ler dados do link: ' + e.message, 'error');
  }
}

async function hashSenha(senha) {
  try {
    var enc = new TextEncoder().encode(senha);
    var buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2,'0'); }).join('');
  } catch(e) {
    var hash = 0;
    for (var i = 0; i < senha.length; i++) {
      var chr = senha.charCodeAt(i);
      hash = ((hash << 5) - hash) + chr;
      hash |= 0;
    }
    return 'fallback_' + Math.abs(hash).toString(16);
  }
}

// A tabela `usuarios` não é mais lida/gravada direto pelo navegador.
// Isso tudo passa pela Edge Function auth-users (roda com service_role,

// Function. Se não estiver guardada nesta aba (ex: página foi
// recarregada), pede pra digitar de novo em vez de simplesmente falhar.
function getAdminSenha() {
  return sessionStorage.getItem('tbp_admin_senha') || '';

function pedirSenhaAdmin() {
  var senha = prompt('Sua sessão de administrador expirou nesta aba.\nDigite sua senha (' + currentUser.email + ') para continuar:');
  if (senha) sessionStorage.setItem('tbp_admin_senha', senha);
  return senha || '';
}
// Chama a Edge Function como admin; se as credenciais guardadas na aba
// estiverem erradas/ausentes, pede a senha uma vez e tenta de novo.
async function callAuthFnAsAdmin(payloadSemAdmin) {
  var senha = getAdminSenha();
  var res = await callAuthFn(Object.assign({}, payloadSemAdmin, { admin: { email: currentUser.email, senha: senha } }));
  if (!res.ok && res.error === 'Credenciais de administrador inválidas') {
    senha = pedirSenhaAdmin();
    if (!senha) return res;
    res = await callAuthFn(Object.assign({}, payloadSemAdmin, { admin: { email: currentUser.email, senha: senha } }));
  }
  return res;
}

async function doLogin(e) {
  e.preventDefault();
  var email = document.getElementById('loginEmail').value.trim().toLowerCase();
  var senha = document.getElementById('loginSenha').value;
  var errEl = document.getElementById('loginError');
  errEl.textContent = '';

  var btn = e.target.querySelector('.btn-login');
  if (btn) { btn.disabled = true; btn.textContent = 'Entrando...'; }
  var res;
  try {
    res = await callAuthFn({ action: 'login', email: email, senha: senha });
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = 'Entrar'; }
    errEl.textContent = 'Não foi possível conectar ao servidor de login.';
    return;
  }

  if (!res.ok) {
    if (btn) { btn.disabled = false; btn.textContent = 'Entrar'; }
    errEl.textContent = res.error || 'Falha no login';
    return;
  }

  // Autentica de verdade no Supabase Auth para obter um token de sessão.
  // Se ainda não existir usuário correspondente no Supabase Auth (ex: durante
  // a migração, antes do administrador cadastrar todos os usuários lá), o
  // login do app não é bloqueado — só a sincronização de dados fica limitada
  // até o Auth ser configurado (e, nesse caso, o RLS também ainda não deve
  // estar travado, então os dados continuam acessíveis normalmente).
  try {
    var authData = await supabaseAuthLogin(email, senha);
    var now = Math.floor(Date.now() / 1000);
    saveAuthSession({
      access_token: authData.access_token,
      refresh_token: authData.refresh_token,
      expires_at: authData.expires_at || (now + (authData.expires_in || 3600))
    });
  } catch (err) {
    console.warn('Login de permissões OK, mas Supabase Auth falhou (' + err.message + '). Prosseguindo sem token de sessão.');
    saveAuthSession(null);
  }

  if (btn) { btn.disabled = false; btn.textContent = 'Entrar'; }

  currentUser = res.user;
  saveCurrentUser(currentUser);
  // Guardado só nesta aba (sessionStorage), só para re-autenticar
  // ações de administrador (criar/editar/excluir usuário) na Edge
  // Function. Some ao fechar a aba ou fazer logout.
  if (currentUser.admin) sessionStorage.setItem('tbp_admin_senha', senha);
  document.getElementById('loginScreen').style.display = 'none';
  applyUserAccess();
  await postLoginInit();
}

async function saveUser(e, id) {
  e.preventDefault();
  var nome = document.getElementById('uf_nome').value.trim();
  var email = document.getElementById('uf_email').value.trim().toLowerCase();
  var senha = document.getElementById('uf_senha').value;
  var isAdmin = document.getElementById('uf_admin').checked;
  var permissoes = [];
  document.querySelectorAll('.perm-check:checked').forEach(function(cb) { permissoes.push(cb.value); });
  if (isAdmin) permissoes = allPermissions.map(function(p) { return p.key; });

  var res;
  if (id) {
    res = await callAuthFnAsAdmin({ action: 'update', id: id, dados: { nome: nome, email: email, senha: senha, admin: isAdmin, permissoes: permissoes } });
  } else {
    if (!senha) { toast('Informe a senha', 'error'); return; }
    res = await callAuthFnAsAdmin({ action: 'create', novo: { nome: nome, email: email, senha: senha, admin: isAdmin, permissoes: permissoes } });
  }

  if (!res.ok) { toast(res.error || 'Falha ao salvar usuário', 'error'); return; }
  toast(id ? 'Usuário atualizado!' : 'Usuário criado!');
  showUserManager();
}

async function postLoginInit() {

  checkImportFromUrl();

  if (state.fornecedores.length === 0) {
    var fornDefault = [

      state.fornecedores.push({ id: uid(), nome: nome, doc: '', email: '', telefone: '' });
    });
    saveState();
    console.log('Fornecedores padrão cadastrados: ' + fornDefault.length);
  }

  var hasData = state.products.length > 0 || state.clients.length > 0;
  console.log('Init: produtos=' + state.products.length + ', clientes=' + state.clients.length + ', precos=' + Object.keys(state.prices).length);

  if (hasData) {
    updateSyncStatus('success', 'Supabase conectado');
    render();
  } else {
    updateSyncStatus('syncing', 'Sincronizando planilha...');
    render();
    syncAll();
  }
}

(async function() {
  await ensureAdminUser();
  var savedUser = getCurrentUser();

  if (savedUser) {
    currentUser = savedUser;
    document.getElementById('loginScreen').style.display = 'none';
    applyUserAccess();
    // Tenta renovar/validar a sessão do Supabase Auth em segundo plano, sem
    // bloquear o acesso caso ainda não exista (ex: antes do administrador
    // terminar de configurar o Auth para todos os usuários) — nesse caso a
    // API cai de volta para a chave anônima, que continua funcionando
    // normalmente enquanto o RLS não estiver travado.
    await getValidAccessToken().catch(function() { return null; });
    await postLoginInit();
  } else {
    updateSyncStatus('offline', 'Aguardando login');
    render();
    setTimeout(function() { document.getElementById('loginEmail').focus(); }, 100);
  }
})();
// ===== EVENT DELEGATION para botões de editar/excluir =====
document.addEventListener('click', function(e) {
  var btn = e.target.closest('[data-action]');
  if (!btn) return;
  var action = btn.getAttribute('data-action');
  var id = btn.getAttribute('data-id');
  if (!id) return;
  if (action === 'delete-client') deleteClient(id);
  else if (action === 'edit-client') showClientForm(id);
  else if (action === 'delete-product') deleteProduct(id);
  else if (action === 'edit-product') showProductForm(id);
  else if (action === 'delete-fornecedor') deleteFornecedor(id);
  else if (action === 'edit-fornecedor') showFornecedorForm(id);
  else if (action === 'delete-conta') deleteConta(id);
});

</script>
